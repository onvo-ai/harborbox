name: harborbox

configs:
  # A TCP passthrough to buildkitd, and the only reason it exists is that the
  # builder is deliberately not in this project any more -- it is a separate
  # Compose application (compose.builder.yaml) so that the project network
  # Coolify appends to every service reaches nothing but the builder itself.
  #
  # The API cannot simply join the build network to reach it: every network the
  # builder is on is one a caller's `RUN` can reach, because a build step runs
  # in buildkitd's network namespace. So the API stays off that network and
  # this dual-homed proxy carries the connection across, exactly as the
  # registry below is dual-homed -- Docker does not route between bridge
  # networks, so a build step reaching this container reaches this listener and
  # nothing behind it. What stops a build step *using* that listener is the
  # mutual TLS buildkitd requires; this proxy passes the handshake through
  # untouched and terminates nothing.
  buildkit-gateway-config:
    content: |
      global
        log stdout format raw local0 info
        # Without an explicit cap haproxy sizes its connection tables from the
        # container's file-descriptor ulimit, which Docker sets to something
        # enormous, and the worker is OOM-killed at boot inside this memory
        # limit -- `exited with code 137` in a restart loop, with no mention of
        # memory anywhere in its own log. The API runs at most
        # HARBORBOX_TEMPLATE_MAX_CONCURRENT_BUILDS connections through here.
        maxconn 256

      defaults
        mode tcp
        log global
        option tcplog
        timeout connect 10s
        # One build holds one connection for its whole duration, and the API's
        # own ceiling is HARBORBOX_TEMPLATE_BUILD_TIMEOUT_SECONDS (1800s by
        # default). Anything shorter than that cuts long builds at the proxy,
        # which surfaces as an unexplained gRPC error rather than a timeout.
        timeout client 2h
        timeout server 2h

      # Without this haproxy resolves `builder` once, at startup, and keeps the
      # address forever -- so the first redeploy of the builder project, which
      # gives it a new container IP, silently breaks every build until this
      # container is restarted too.
      resolvers docker
        nameserver embedded 127.0.0.11:53
        resolve_retries 3
        timeout resolve 1s
        timeout retry 1s
        hold valid 10s
        hold nx 1s
        hold other 1s

      frontend buildkit
        bind :1234
        default_backend builder

      backend builder
        # init-addr libc,none: start even when the builder project is not up
        # yet. The two projects are deployed separately and in either order.
        server builder builder:1234 resolvers docker init-addr libc,none

  opensandbox-config:
    content: |
      [server]
      host = "0.0.0.0"
      port = 8080
      max_sandbox_timeout_seconds = 86400

      [log]
      level = "INFO"

      [runtime]
      type = "docker"
      execd_image = "opensandbox/execd:v1.0.21"

      [store]
      type = "sqlite"
      path = "/var/lib/opensandbox/opensandbox.db"

      [docker]
      network_mode = "bridge"
      host_ip = "host.docker.internal"
      port_range_min = 40000
      port_range_max = 60000
      drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
      no_new_privileges = true
      pids_limit = 4096

      [ingress]
      mode = "direct"

      [egress]
      image = "opensandbox/egress:v1.1.5"
      mode = "dns"

services:
  # Image build target only. The inactive profile keeps it out of the normal
  # runtime stack and out of OrbStack's container list.
  sandbox-base-image:
    profiles: ["build"]
    image: 127.0.0.1:${HARBORBOX_REGISTRY_PORT:-5050}/${HARBORBOX_TEMPLATE_IMAGE_PREFIX:-harborbox-sandbox}-onvo-pro:${HARBORBOX_TEMPLATE_VERSION:-local}
    build:
      context: .
      dockerfile: sandbox/Dockerfile



  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: harborbox
      POSTGRES_USER: harborbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harborbox}
    volumes:
      - harborbox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harborbox -d harborbox"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    restart: unless-stopped
    networks:
      - control

  # Derived template images live here. BuildKit pushes over the `build`
  # network as `registry:5000`; the host's Docker daemon pulls through the
  # published port as `127.0.0.1:5050` when opensandbox creates a sandbox.
  # Everything after the host part is identical between the two, which is the
  # invariant the whole split rests on -- see
  # docs/arbitrary-dockerfile-templates.md section 10.3.
  #
  # Loopback-only, and that is also what lets the daemon accept plain HTTP
  # without an `insecure-registries` edit. Delete must be enabled or the
  # template collector cannot reclaim anything.
  # Hashes the registry credentials into a volume, then exits. The registry
  # waits for it.
  #
  # This used to be a `./auth:/auth:ro` bind against a file the operator
  # generated by hand. `auth/` is a credential and so is gitignored, which
  # means a fresh checkout does not have it -- and a bind mount of a missing
  # path makes Docker create an empty *directory*. The registry then panics on
  # `open /auth/htpasswd: read-only file system` and crash-loops. That is what
  # the first production deploy did, and nothing in the repository could have
  # caught it, because a machine that had ever run the local script had the
  # file already.
  #
  # Deriving it from the same variable the API authenticates with also removes
  # the failure where the two drift apart and every push 401s.
  registry-auth:
    image: httpd:2-alpine
    command:
      - sh
      - -c
      - htpasswd -Bbn "$$REGISTRY_USERNAME" "$$REGISTRY_PASSWORD" > /auth/htpasswd
    environment:
      REGISTRY_USERNAME: ${HARBORBOX_REGISTRY_USERNAME:-harborbox}
      REGISTRY_PASSWORD: ${HARBORBOX_REGISTRY_PASSWORD:?set a registry password}
    volumes:
      - harborbox-registry-auth:/auth
    restart: "no"
    # It hashes a string and writes a file. Giving it the `build` network would
    # also break the invariant that network's test asserts: what sits on it is
    # what a build step can reach.
    network_mode: none

  registry:
    image: registry:3
    depends_on:
      registry-auth:
        condition: service_completed_successfully
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - harborbox-registry-auth:/auth:ro
      - harborbox-registry:/var/lib/registry
    ports:
      - "127.0.0.1:${HARBORBOX_REGISTRY_PORT:-5050}:5000"
    healthcheck:
      test: ["CMD", "/bin/registry", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    networks:
      # Dual-homed on purpose. `build` is how BuildKit pushes; `control` is how
      # the API deletes manifests when the template collector reclaims an image.
      # Docker does not route between bridge networks, so this does not let the
      # builder reach anything on `control`.
      - build
      - control

  # The API's route to buildkitd, which lives in the other Compose project.
  #
  # `builder` used to be a service here and the API drove it over a unix socket
  # in a shared volume. That was the strongest version of the isolation --
  # no shared network at all -- and it did not survive deployment: Coolify
  # appends its project network to every service of an application, so on the
  # infrastructure host the builder was on that network too, and from inside a
  # build step `api:8000`, `opensandbox:8080` and `postgres:5432` all answered.
  # A socket cannot cross Compose projects, so moving the builder out (which is
  # what makes Coolify's attachment harmless) costs the socket. See the header
  # of compose.builder.yaml.
  #
  # Dual-homed for the same reason the registry is, and with the same
  # justification: Docker does not route between bridge networks, so being
  # reachable from `build` does not put anything on `control` within reach of a
  # build step. The only thing behind this listener is buildkitd, and buildkitd
  # requires a client certificate.
  buildkit-gateway:
    image: haproxy:3.2-alpine
    configs:
      - source: buildkit-gateway-config
        target: /usr/local/etc/haproxy/haproxy.cfg
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
    restart: unless-stopped
    networks:
      - build
      - control

  opensandbox:
    image: opensandbox/server:v0.2.2
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_SERVER_API_KEY: ${OPENSANDBOX_API_KEY:-change-me-opensandbox}
    configs:
      - source: opensandbox-config
        target: /etc/opensandbox/config.toml
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - opensandbox-state:/var/lib/opensandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 512
    restart: unless-stopped
    networks:
      - control

  api:
    image: harborbox-api:local
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      opensandbox:
        condition: service_healthy
    environment:
      HARBORBOX_API_KEY: ${HARBORBOX_API_KEY:-change-me}
      # Telemetry. Unset, and that is the safety property rather than an
      # oversight: with no endpoint Harborbox instruments nothing at all, so a
      # local stack costs nothing and cannot post into the estate's SigNoz.
      # DEV-1824 is what that rule is worth -- laptops exporting under the
      # production service name made 94% of "production" errors somebody's
      # `pnpm dev`, and buried the two real ones.
      #
      # Point these at the estate's ingester to opt in. It is safe to: with
      # HARBORBOX_ENVIRONMENT left at development the spans arrive under
      # `harborbox-dev`, so opting in still cannot be mistaken for production.
      HARBORBOX_ENVIRONMENT: ${HARBORBOX_ENVIRONMENT:-development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      HARBORBOX_EXECUTION_SECRET_KEY: ${HARBORBOX_EXECUTION_SECRET_KEY:-local-development-secret-change-me}
      HARBORBOX_DATABASE_URL: postgresql+asyncpg://harborbox:${POSTGRES_PASSWORD:-harborbox}@postgres/harborbox
      HARBORBOX_OPENSANDBOX_DOMAIN: opensandbox:8080
      HARBORBOX_OPENSANDBOX_PROTOCOL: http
      HARBORBOX_OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-change-me-opensandbox}
      # opensandbox v0.2.2's proxy returns 500 ("An internal error occurred in
      # the proxy") for execd's streaming /code endpoint, while /ping through
      # that same proxy is fine. So Python execution talks to the published
      # execd port directly, which is what extra_hosts below is for.
      HARBORBOX_OPENSANDBOX_USE_SERVER_PROXY: ${HARBORBOX_OPENSANDBOX_USE_SERVER_PROXY:-false}
      HARBORBOX_OPENSANDBOX_READY_TIMEOUT_SECONDS: ${HARBORBOX_OPENSANDBOX_READY_TIMEOUT_SECONDS:-30}
      # These two are a pair, and the API refuses to start if they cross: the
      # start's own budget must outlast the caller's wait, or a slow cold start
      # dies before the caller is told it is still starting (DEV-2032). Raise
      # one and raise the other.
      HARBORBOX_SANDBOX_START_TIMEOUT_SECONDS: ${HARBORBOX_SANDBOX_START_TIMEOUT_SECONDS:-120}
      HARBORBOX_LAZY_START_WAIT_TIMEOUT_SECONDS: ${HARBORBOX_LAZY_START_WAIT_TIMEOUT_SECONDS:-60}
      HARBORBOX_OPENSANDBOX_SNAPSHOT_TIMEOUT_SECONDS: ${HARBORBOX_OPENSANDBOX_SNAPSHOT_TIMEOUT_SECONDS:-300}
      HARBORBOX_BASE_IMAGE: harborbox-sandbox-base:${HARBORBOX_IMAGE_TAG:-local}
      # Pools by template name. A product that wants its own image kept
      # warm adds it here: {"base":1,"custom-abc123def456":2}.
      HARBORBOX_WARM_POOL: ${HARBORBOX_WARM_POOL:-{"base":1}}
      HARBORBOX_TEMPLATE_IMAGE_PREFIX: ${HARBORBOX_TEMPLATE_IMAGE_PREFIX:-harborbox-sandbox}
      HARBORBOX_TEMPLATE_VERSION: ${HARBORBOX_TEMPLATE_VERSION:-local}
      # Builds run on the rootless builder, which is a separate Compose
      # project (compose.builder.yaml) reached through the gateway above --
      # not on this container's daemon, which it no longer has.
      #
      # TCP, where this used to be a unix socket, and the certificates are not
      # optional decoration: Settings refuses to start a tcp:// builder address
      # without them. Anything that can open this port could otherwise drive
      # buildkitd, and a caller's build step can open this port.
      HARBORBOX_BUILDER_ADDRESS: tcp://buildkit-gateway:1234
      HARBORBOX_BUILDER_TLS_CA_CERT: /certs/buildkit/ca.pem
      HARBORBOX_BUILDER_TLS_CERT: /certs/buildkit/cert.pem
      HARBORBOX_BUILDER_TLS_KEY: /certs/buildkit/key.pem
      HARBORBOX_REGISTRY_PUSH_ENDPOINT: registry:5000
      HARBORBOX_REGISTRY_PULL_ENDPOINT: 127.0.0.1:${HARBORBOX_REGISTRY_PORT:-5050}
      HARBORBOX_REGISTRY_USERNAME: ${HARBORBOX_REGISTRY_USERNAME:-harborbox}
      HARBORBOX_REGISTRY_PASSWORD: ${HARBORBOX_REGISTRY_PASSWORD:-change-me-registry}
      # BuildKit has no implicit "localhost is insecure" rule the way the
      # Docker daemon does, so plain HTTP has to be declared.
      HARBORBOX_REGISTRY_INSECURE: ${HARBORBOX_REGISTRY_INSECURE:-true}
      HARBORBOX_TEMPLATE_BUILD_TIMEOUT_SECONDS: ${HARBORBOX_TEMPLATE_BUILD_TIMEOUT_SECONDS:-1800}
      # Caller-supplied Dockerfiles. Off unless a deployment opts in: an
      # arbitrary RUN is a different trust class from an allowlisted package
      # name. HARBORBOX_TEMPLATE_FROM_ALLOWLIST is what still constrains the
      # result -- what a build installs is unbounded, what it starts from is not.
      HARBORBOX_TEMPLATE_FROM_ALLOWLIST: ${HARBORBOX_TEMPLATE_FROM_ALLOWLIST:-["docker.io/library"]}
      HARBORBOX_TEMPLATE_CONTEXT_ROOT: /var/lib/harborbox/build-contexts
      HARBORBOX_TEMPLATE_MAX_CONCURRENT_BUILDS: ${HARBORBOX_TEMPLATE_MAX_CONCURRENT_BUILDS:-2}
      HARBORBOX_TEMPLATE_GC_ENABLED: ${HARBORBOX_TEMPLATE_GC_ENABLED:-true}
      HARBORBOX_TEMPLATE_GC_MAX_IDLE_DAYS: ${HARBORBOX_TEMPLATE_GC_MAX_IDLE_DAYS:-14}
      HARBORBOX_TEMPLATE_GC_INTERVAL_SECONDS: ${HARBORBOX_TEMPLATE_GC_INTERVAL_SECONDS:-3600}
      HARBORBOX_WARM_POOL_ENABLED: ${HARBORBOX_WARM_POOL_ENABLED:-true}
      HARBORBOX_WARM_POOL_WARMUP_CONCURRENCY: ${HARBORBOX_WARM_POOL_WARMUP_CONCURRENCY:-2}
      HARBORBOX_WARM_POOL_RECONCILE_SECONDS: ${HARBORBOX_WARM_POOL_RECONCILE_SECONDS:-2}
      HARBORBOX_WARM_POOL_IDLE_TTL_SECONDS: ${HARBORBOX_WARM_POOL_IDLE_TTL_SECONDS:-900}
      HARBORBOX_WARM_POOL_RELEASE_AFTER_INACTIVITY_SECONDS: ${HARBORBOX_WARM_POOL_RELEASE_AFTER_INACTIVITY_SECONDS:-300}
      HARBORBOX_WARM_POOL_RELEASE_ON_SHUTDOWN: ${HARBORBOX_WARM_POOL_RELEASE_ON_SHUTDOWN:-true}
      HARBORBOX_SANDBOX_NETWORK: harborbox-net
      HARBORBOX_SANDBOX_EGRESS_NETWORK: harborbox-egress
      HARBORBOX_SANDBOX_RUNTIME: ${HARBORBOX_SANDBOX_RUNTIME:-}
      HARBORBOX_HOST_MEMORY_RESERVE_PERCENT: ${HARBORBOX_HOST_MEMORY_RESERVE_PERCENT:-25}
      HARBORBOX_HOST_MEMORY_RESERVE_MIN_MB: ${HARBORBOX_HOST_MEMORY_RESERVE_MIN_MB:-1024}
      HARBORBOX_PLATFORM_MEMORY_RESERVE_MB: ${HARBORBOX_PLATFORM_MEMORY_RESERVE_MB:-512}
      HARBORBOX_EMERGENCY_AVAILABLE_MEMORY_MB: ${HARBORBOX_EMERGENCY_AVAILABLE_MEMORY_MB:-512}
      # This is an admission ceiling, not a reservation. With no running
      # sandboxes Harborbox allocates 0 MB of this budget.
      HARBORBOX_SANDBOX_MEMORY_BUDGET_MB: ${HARBORBOX_SANDBOX_MEMORY_BUDGET_MB:-4096}
      HARBORBOX_DEFAULT_SANDBOX_MEMORY_MB: ${HARBORBOX_ONVO_SANDBOX_MEMORY_MB:-1024}
      HARBORBOX_MAX_SANDBOX_MEMORY_MB: ${HARBORBOX_MAX_SANDBOX_MEMORY_MB:-4096}
      HARBORBOX_DEFAULT_SANDBOX_CPU: ${HARBORBOX_ONVO_SANDBOX_CPU:-2}
      HARBORBOX_MAX_PARALLEL_CPU: ${HARBORBOX_MAX_PARALLEL_CPU:-4}
      HARBORBOX_MAX_CONCURRENT_EXECUTIONS_PER_SANDBOX: ${HARBORBOX_ONVO_CONCURRENCY:-2}
      # Match the deployed defaults. At 0.05 the scheduler ran `capacity()` —
      # two memory probes and two aggregates — 20x a second on an empty queue,
      # which idled at ~20% CPU and 27 database transactions per second against
      # internal-tools' 7.5% and 4.4. The cost of 0.25 is up to 200ms of extra
      # pickup latency, against seconds of sandbox startup.
      HARBORBOX_SCHEDULER_POLL_SECONDS: ${HARBORBOX_SCHEDULER_POLL_SECONDS:-0.25}
      HARBORBOX_REAPER_POLL_SECONDS: ${HARBORBOX_REAPER_POLL_SECONDS:-5}
      HARBORBOX_MAX_UPLOAD_BYTES: ${HARBORBOX_MAX_UPLOAD_BYTES:-157286400}
      HARBORBOX_DEFAULT_IDLE_TIMEOUT_SECONDS: ${HARBORBOX_ONVO_IDLE_TIMEOUT_SECONDS:-1200}
    volumes:
      # A client certificate, and nothing else that grants anything. This
      # replaces the Docker socket the API used to mount for POST
      # /v1/templates: it can ask the rootless builder for an image build, and
      # it cannot start a container on this host. See the deployment notes in
      # README.md.
      #
      # Read-only, and it is the client half of the PKI only -- the builder's
      # own key lives in a different volume this container never sees.
      # Bind mount for the reason given in compose.builder.yaml: a named
      # volume gets namespaced by Coolify and silently arrives empty.
      # No `${VAR:-default}` here. Coolify splits a volume string on `:`
      # before interpolating it, so the `:-` inside a default lands in the
      # middle of source:target:mode and the deploy dies on
      #   invalid spec: /data/harborbox/buildkit-tls:: empty section between colons
      # Ports tolerate the same syntax; volumes do not. The variable is
      # therefore required -- set it on both applications, and see
      # .env.example.
      - ./.buildkit-tls/client:/certs/buildkit:ro
      # Uploaded build contexts. buildctl streams `--local` directories from
      # the *client*, so this belongs to the API and not to the builder; it was
      # mounted on the builder here, where it did nothing, while the API kept
      # its contexts on a container filesystem that a restart discarded.
      - harborbox-contexts:/var/lib/harborbox/build-contexts
    ports:
      - "127.0.0.1:${HARBORBOX_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
    restart: unless-stopped
    networks:
      control:
        aliases:
          - harborbox-api

volumes:
  harborbox-postgres:
  opensandbox-state:
  harborbox-registry:
  harborbox-registry-auth:
  harborbox-contexts:

networks:
  control:
    name: harborbox-control
  # The registry, the buildkit gateway, and -- from the other Compose project
  # -- the builder. Nothing else, ever: a build step runs inside buildkitd's
  # network namespace, so every member of this network is something a
  # caller-supplied `RUN` can reach.
  #
  # External and named because compose.builder.yaml joins the same network from
  # a different project, and because Coolify rewrites Compose-managed network
  # definitions. Created once, out of band:
  #   docker network create harborbox-build
  build:
    name: harborbox-build
    external: true
