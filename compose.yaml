name: harborbox

configs:
  # BuildKit resolves `FROM` itself, and that resolution does NOT inherit the
  # `registry.insecure=true` Harborbox puts on the build output -- that flag
  # only covers the push. Without this the first product Dockerfile to build
  # FROM the base dies on
  #   http: server gave HTTP response to HTTPS client
  # which reads like a broken registry rather than a missing daemon setting.
  buildkitd-config:
    content: |
      [registry."registry:5000"]
        http = true
        insecure = true

  opensandbox-config:
    content: |
      [server]
      host = "0.0.0.0"
      port = 8080
      max_sandbox_timeout_seconds = 86400

      [log]
      level = "INFO"

      [runtime]
      type = "docker"
      execd_image = "opensandbox/execd:v1.0.21"

      [store]
      type = "sqlite"
      path = "/var/lib/opensandbox/opensandbox.db"

      [docker]
      network_mode = "bridge"
      host_ip = "host.docker.internal"
      port_range_min = 40000
      port_range_max = 60000
      drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
      no_new_privileges = true
      pids_limit = 4096

      [ingress]
      mode = "direct"

      [egress]
      image = "opensandbox/egress:v1.1.5"
      mode = "dns"

services:
  # Image build target only. The inactive profile keeps it out of the normal
  # runtime stack and out of OrbStack's container list.
  sandbox-base-image:
    profiles: ["build"]
    image: 127.0.0.1:${HARBORBOX_REGISTRY_PORT:-5050}/${HARBORBOX_TEMPLATE_IMAGE_PREFIX:-harborbox-sandbox}-onvo-pro:${HARBORBOX_TEMPLATE_VERSION:-local}
    build:
      context: .
      dockerfile: sandbox/Dockerfile



  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: harborbox
      POSTGRES_USER: harborbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harborbox}
    volumes:
      - harborbox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harborbox -d harborbox"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    restart: unless-stopped
    networks:
      - control

  # Derived template images live here. BuildKit pushes over the `build`
  # network as `registry:5000`; the host's Docker daemon pulls through the
  # published port as `127.0.0.1:5050` when opensandbox creates a sandbox.
  # Everything after the host part is identical between the two, which is the
  # invariant the whole split rests on -- see
  # docs/arbitrary-dockerfile-templates.md section 10.3.
  #
  # Loopback-only, and that is also what lets the daemon accept plain HTTP
  # without an `insecure-registries` edit. Delete must be enabled or the
  # template collector cannot reclaim anything.
  # Hashes the registry credentials into a volume, then exits. The registry
  # waits for it.
  #
  # This used to be a `./auth:/auth:ro` bind against a file the operator
  # generated by hand. `auth/` is a credential and so is gitignored, which
  # means a fresh checkout does not have it -- and a bind mount of a missing
  # path makes Docker create an empty *directory*. The registry then panics on
  # `open /auth/htpasswd: read-only file system` and crash-loops. That is what
  # the first production deploy did, and nothing in the repository could have
  # caught it, because a machine that had ever run the local script had the
  # file already.
  #
  # Deriving it from the same variable the API authenticates with also removes
  # the failure where the two drift apart and every push 401s.
  registry-auth:
    image: httpd:2-alpine
    command:
      - sh
      - -c
      - htpasswd -Bbn "$$REGISTRY_USERNAME" "$$REGISTRY_PASSWORD" > /auth/htpasswd
    environment:
      REGISTRY_USERNAME: ${HARBORBOX_REGISTRY_USERNAME:-harborbox}
      REGISTRY_PASSWORD: ${HARBORBOX_REGISTRY_PASSWORD:?set a registry password}
    volumes:
      - harborbox-registry-auth:/auth
    restart: "no"
    # It hashes a string and writes a file. Giving it the `build` network would
    # also break the invariant that network's test asserts: what sits on it is
    # what a build step can reach.
    network_mode: none

  registry:
    image: registry:3
    depends_on:
      registry-auth:
        condition: service_completed_successfully
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - harborbox-registry-auth:/auth:ro
      - harborbox-registry:/var/lib/registry
    ports:
      - "127.0.0.1:${HARBORBOX_REGISTRY_PORT:-5050}:5000"
    healthcheck:
      test: ["CMD", "/bin/registry", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    networks:
      # Dual-homed on purpose. `build` is how BuildKit pushes; `control` is how
      # the API deletes manifests when the template collector reclaims an image.
      # Docker does not route between bridge networks, so this does not let the
      # builder reach anything on `control`.
      - build
      - control

  # Rootless BuildKit: where caller-supplied template specs become images. It
  # holds no Docker socket, so a build step is an unprivileged process in a
  # user namespace rather than root on this host.
  #
  # Three things here are load-bearing and were verified on a live stack; see
  # docs/arbitrary-dockerfile-templates.md section 10:
  #
  #   1. `systempaths=unconfined` rather than the `--oci-worker-no-process-sandbox`
  #      flag most rootless BuildKit guides use. Both start buildkitd
  #      unprivileged; only this one keeps the per-step process sandbox.
  #   2. It joins `build` and nothing else. Under `network_mode: host` a build
  #      step reached a service published on host loopback.
  #   3. Native overlayfs needs /dev/fuse and user namespaces. Check
  #      `docker logs` for `using overlayfs`; `fuse-overlayfs` also works, slower.
  builder:
    image: moby/buildkit:rootless
    configs:
      - source: buildkitd-config
        target: /home/user/.config/buildkit/buildkitd.toml
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    devices:
      - /dev/fuse
    volumes:
      # The API drives buildkitd over this socket instead of TCP, so the two
      # need no shared network -- and a build step, which runs in buildkitd's
      # network namespace, therefore cannot reach the control plane.
      #
      # /run/user/1000 specifically: the image already owns that path as uid
      # 1000, which a fresh named volume inherits. Anywhere else buildkitd gets
      # a root-owned directory and dies with `bind: permission denied`.
      - harborbox-buildkit-run:/run/user/1000
      - harborbox-contexts:/var/lib/harborbox/build-contexts
      - harborbox-buildkit:/home/user/.local/share/buildkit
    healthcheck:
      test: ["CMD", "buildctl", "debug", "workers"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped
    networks:
      - build

  opensandbox:
    image: opensandbox/server:v0.2.2
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_SERVER_API_KEY: ${OPENSANDBOX_API_KEY:-change-me-opensandbox}
    configs:
      - source: opensandbox-config
        target: /etc/opensandbox/config.toml
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - opensandbox-state:/var/lib/opensandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 512
    restart: unless-stopped
    networks:
      - control

  api:
    image: harborbox-api:local
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      opensandbox:
        condition: service_healthy
    environment:
      HARBORBOX_API_KEY: ${HARBORBOX_API_KEY:-change-me}
      HARBORBOX_EXECUTION_SECRET_KEY: ${HARBORBOX_EXECUTION_SECRET_KEY:-local-development-secret-change-me}
      HARBORBOX_DATABASE_URL: postgresql+asyncpg://harborbox:${POSTGRES_PASSWORD:-harborbox}@postgres/harborbox
      HARBORBOX_OPENSANDBOX_DOMAIN: opensandbox:8080
      HARBORBOX_OPENSANDBOX_PROTOCOL: http
      HARBORBOX_OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-change-me-opensandbox}
      # opensandbox v0.2.2's proxy returns 500 ("An internal error occurred in
      # the proxy") for execd's streaming /code endpoint, while /ping through
      # that same proxy is fine. So Python execution talks to the published
      # execd port directly, which is what extra_hosts below is for.
      HARBORBOX_OPENSANDBOX_USE_SERVER_PROXY: ${HARBORBOX_OPENSANDBOX_USE_SERVER_PROXY:-false}
      HARBORBOX_OPENSANDBOX_READY_TIMEOUT_SECONDS: ${HARBORBOX_OPENSANDBOX_READY_TIMEOUT_SECONDS:-30}
      HARBORBOX_OPENSANDBOX_SNAPSHOT_TIMEOUT_SECONDS: ${HARBORBOX_OPENSANDBOX_SNAPSHOT_TIMEOUT_SECONDS:-300}
      HARBORBOX_BASE_IMAGE: harborbox-sandbox-base:${HARBORBOX_IMAGE_TAG:-local}
      # Pools by template name. A product that wants its own image kept
      # warm adds it here: {"base":1,"custom-abc123def456":2}.
      HARBORBOX_WARM_POOL: ${HARBORBOX_WARM_POOL:-{"base":1}}
      HARBORBOX_TEMPLATE_IMAGE_PREFIX: ${HARBORBOX_TEMPLATE_IMAGE_PREFIX:-harborbox-sandbox}
      HARBORBOX_TEMPLATE_VERSION: ${HARBORBOX_TEMPLATE_VERSION:-local}
      # Builds run on the rootless builder, over a socket, not on this
      # container's daemon -- it no longer has one.
      HARBORBOX_BUILDER_ADDRESS: unix:///run/user/1000/buildkit/buildkitd.sock
      HARBORBOX_REGISTRY_PUSH_ENDPOINT: registry:5000
      HARBORBOX_REGISTRY_PULL_ENDPOINT: 127.0.0.1:${HARBORBOX_REGISTRY_PORT:-5050}
      HARBORBOX_REGISTRY_USERNAME: ${HARBORBOX_REGISTRY_USERNAME:-harborbox}
      HARBORBOX_REGISTRY_PASSWORD: ${HARBORBOX_REGISTRY_PASSWORD:-change-me-registry}
      # BuildKit has no implicit "localhost is insecure" rule the way the
      # Docker daemon does, so plain HTTP has to be declared.
      HARBORBOX_REGISTRY_INSECURE: ${HARBORBOX_REGISTRY_INSECURE:-true}
      HARBORBOX_TEMPLATE_BUILD_TIMEOUT_SECONDS: ${HARBORBOX_TEMPLATE_BUILD_TIMEOUT_SECONDS:-1800}
      # Caller-supplied Dockerfiles. Off unless a deployment opts in: an
      # arbitrary RUN is a different trust class from an allowlisted package
      # name. HARBORBOX_TEMPLATE_FROM_ALLOWLIST is what still constrains the
      # result -- what a build installs is unbounded, what it starts from is not.
      HARBORBOX_TEMPLATE_FROM_ALLOWLIST: ${HARBORBOX_TEMPLATE_FROM_ALLOWLIST:-["docker.io/library"]}
      HARBORBOX_TEMPLATE_CONTEXT_ROOT: /var/lib/harborbox/build-contexts
      HARBORBOX_TEMPLATE_MAX_CONCURRENT_BUILDS: ${HARBORBOX_TEMPLATE_MAX_CONCURRENT_BUILDS:-2}
      HARBORBOX_TEMPLATE_GC_ENABLED: ${HARBORBOX_TEMPLATE_GC_ENABLED:-true}
      HARBORBOX_TEMPLATE_GC_MAX_IDLE_DAYS: ${HARBORBOX_TEMPLATE_GC_MAX_IDLE_DAYS:-14}
      HARBORBOX_TEMPLATE_GC_INTERVAL_SECONDS: ${HARBORBOX_TEMPLATE_GC_INTERVAL_SECONDS:-3600}
      HARBORBOX_WARM_POOL_ENABLED: ${HARBORBOX_WARM_POOL_ENABLED:-true}
      HARBORBOX_WARM_POOL_WARMUP_CONCURRENCY: ${HARBORBOX_WARM_POOL_WARMUP_CONCURRENCY:-2}
      HARBORBOX_WARM_POOL_RECONCILE_SECONDS: ${HARBORBOX_WARM_POOL_RECONCILE_SECONDS:-2}
      HARBORBOX_WARM_POOL_IDLE_TTL_SECONDS: ${HARBORBOX_WARM_POOL_IDLE_TTL_SECONDS:-900}
      HARBORBOX_WARM_POOL_RELEASE_AFTER_INACTIVITY_SECONDS: ${HARBORBOX_WARM_POOL_RELEASE_AFTER_INACTIVITY_SECONDS:-300}
      HARBORBOX_WARM_POOL_RELEASE_ON_SHUTDOWN: ${HARBORBOX_WARM_POOL_RELEASE_ON_SHUTDOWN:-true}
      HARBORBOX_SANDBOX_NETWORK: harborbox-net
      HARBORBOX_SANDBOX_EGRESS_NETWORK: harborbox-egress
      HARBORBOX_SANDBOX_RUNTIME: ${HARBORBOX_SANDBOX_RUNTIME:-}
      HARBORBOX_HOST_MEMORY_RESERVE_PERCENT: ${HARBORBOX_HOST_MEMORY_RESERVE_PERCENT:-25}
      HARBORBOX_HOST_MEMORY_RESERVE_MIN_MB: ${HARBORBOX_HOST_MEMORY_RESERVE_MIN_MB:-1024}
      HARBORBOX_PLATFORM_MEMORY_RESERVE_MB: ${HARBORBOX_PLATFORM_MEMORY_RESERVE_MB:-512}
      HARBORBOX_EMERGENCY_AVAILABLE_MEMORY_MB: ${HARBORBOX_EMERGENCY_AVAILABLE_MEMORY_MB:-512}
      # This is an admission ceiling, not a reservation. With no running
      # sandboxes Harborbox allocates 0 MB of this budget.
      HARBORBOX_SANDBOX_MEMORY_BUDGET_MB: ${HARBORBOX_SANDBOX_MEMORY_BUDGET_MB:-4096}
      HARBORBOX_DEFAULT_SANDBOX_MEMORY_MB: ${HARBORBOX_ONVO_SANDBOX_MEMORY_MB:-1024}
      HARBORBOX_MAX_SANDBOX_MEMORY_MB: ${HARBORBOX_MAX_SANDBOX_MEMORY_MB:-4096}
      HARBORBOX_DEFAULT_SANDBOX_CPU: ${HARBORBOX_ONVO_SANDBOX_CPU:-2}
      HARBORBOX_MAX_PARALLEL_CPU: ${HARBORBOX_MAX_PARALLEL_CPU:-4}
      HARBORBOX_MAX_CONCURRENT_EXECUTIONS_PER_SANDBOX: ${HARBORBOX_ONVO_CONCURRENCY:-2}
      # Match the deployed defaults. At 0.05 the scheduler ran `capacity()` —
      # two memory probes and two aggregates — 20x a second on an empty queue,
      # which idled at ~20% CPU and 27 database transactions per second against
      # internal-tools' 7.5% and 4.4. The cost of 0.25 is up to 200ms of extra
      # pickup latency, against seconds of sandbox startup.
      HARBORBOX_SCHEDULER_POLL_SECONDS: ${HARBORBOX_SCHEDULER_POLL_SECONDS:-0.25}
      HARBORBOX_REAPER_POLL_SECONDS: ${HARBORBOX_REAPER_POLL_SECONDS:-5}
      HARBORBOX_MAX_UPLOAD_BYTES: ${HARBORBOX_MAX_UPLOAD_BYTES:-157286400}
      HARBORBOX_DEFAULT_IDLE_TIMEOUT_SECONDS: ${HARBORBOX_ONVO_IDLE_TIMEOUT_SECONDS:-1200}
    volumes:
      # The builder's socket, and nothing else. This replaces the Docker socket
      # the API used to mount for POST /v1/templates: it can ask the rootless
      # builder for an image build, and it cannot start a container on this
      # host. See the deployment notes in README.md.
      - harborbox-buildkit-run:/run/user/1000
    ports:
      - "127.0.0.1:${HARBORBOX_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
    restart: unless-stopped
    networks:
      control:
        aliases:
          - harborbox-api

volumes:
  harborbox-postgres:
  opensandbox-state:
  harborbox-registry:
  harborbox-registry-auth:
  harborbox-buildkit:
  harborbox-buildkit-run:
  harborbox-contexts:

networks:
  control:
    name: harborbox-control
  # The builder and the registry, and nothing else. A build step runs inside
  # buildkitd's network namespace, so what the builder can reach is what
  # caller-supplied build steps can reach.
  build:
    name: harborbox-build
