name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    # Self-hosted for the reason onvo's ci.yml documents: the org's Actions
    # spend is blocked, so every GitHub-hosted job fails in ~2s with "recent
    # account payments have failed". Self-hosted runners are not billed.
    runs-on: [self-hosted, onvo-ci]
    permissions:
      contents: read

    # postgres_pool_store.py uses dialects.postgresql.insert and
    # with_for_update(skip_locked=True). SQLite cannot execute either, so its
    # tests need the real thing rather than a fake session.
    #
    # No test uses this service or HARBORBOX_TEST_DATABASE_URL yet - both
    # arrive with the coverage branch (postgres_pool_store.py coverage). Not
    # dead configuration, just not wired up yet.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harborbox
          POSTGRES_PASSWORD: harborbox
          POSTGRES_DB: harborbox_test
        # -d is not optional here: pg_isready defaults the database name to the
        # user name, so without it the probe asks for a `harborbox` database
        # that POSTGRES_DB never creates. It still reports healthy -- the server
        # answering is all pg_isready tests -- but it logs a FATAL every 5s and
        # never touches the database the tests actually use.
        options: >-
          --health-cmd "pg_isready -U harborbox -d harborbox_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]

    env:
      HARBORBOX_TEST_DATABASE_URL: postgresql+asyncpg://harborbox:harborbox@127.0.0.1:5432/harborbox_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy

      # Tests are a blocking gate: a failing test fails this job. Coverage is
      # measured and reported (see the PR comment) but not yet enforced -
      # `[tool.coverage.report]` in pyproject.toml sets no fail_under, so the
      # command can't fail on coverage regardless. `if: always()` keeps
      # coverage measurement running even if Lint or Typecheck failed above,
      # so the PR comment still has numbers to show.
      - name: Tests and coverage
        if: always()
        run: >-
          uv run pytest --cov --cov-report=json --cov-report=term-missing
          --json-report --json-report-file=unit-results.json

      # The backlog behind the ignore list, printed on every run rather than
      # discovered by someone going looking. Expected to be non-zero: it is the
      # docstring, copyright and formatter-conflict families, by design.
      - name: Lint backlog (non-blocking)
        if: always()
        run: uv run ruff check --select ALL --output-format=json -o ruff-strict.json . || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: |
            coverage.json
            unit-results.json
            ruff-strict.json
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E (Compose)
    runs-on: [self-hosted, onvo-ci]
    timeout-minutes: 40
    permissions:
      contents: read
    # Blocking as of Task 21 (see task-21-fix-report.md): a live run against
    # the real stack originally turned up 5 genuine product defects, none of
    # them stale-test flakiness. Four are fixed and covered by unit tests.
    # The fifth, `e2e_smoke::test_two_sandboxes_run_code_in_parallel`, is a
    # documented `xfail` on a real, unresolved defect (a sandbox goes missing
    # from OpenSandbox across a cold pause/resume cycle) rather than a
    # skipped or deleted test -- see the comment on that test for what is
    # known and what still needs a live stack to diagnose further.

    # The runner is 2 cores / 3.7GB. The warm pool alone wants 2x256MB plus
    # 1x1024MB of sandboxes at boot, which is tight enough to tip api into
    # "unhealthy" on its own even once the images below exist. Disabling it
    # keeps the stack lean; the e2e tests create the sandboxes they need.
    env:
      HARBORBOX_WARM_POOL_ENABLED: "false"
      # The stack is built, started, tested against, and torn down entirely
      # within this job, and is never reachable from outside the runner. The
      # key only has to match on both sides (compose's api service and the
      # pytest client) — a repository secret would buy no security here, just
      # an extra manual setup step and an ambient credential.
      HARBORBOX_API_KEY: local-e2e-only-not-a-real-credential

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # compose.yaml puts the three sandbox template images behind
      # `profiles: ["build"]` to keep them out of the normal runtime stack, but
      # that also means a plain `docker compose build` silently skips them —
      # leaving the warm pool with no images to start from. --profile build
      # pulls them back in for this build-only invocation.
      - name: Build the stack
        run: docker compose --profile build build

      # The builder is a second Compose project, and these two are what the two
      # projects share: a bridge neither of them owns, and the mutual-TLS pair
      # the API needs to drive buildkitd over TCP. Both are external volumes /
      # networks on purpose -- a missing one fails `up` by name instead of
      # being silently created empty.
      - name: Create the shared build network and buildkit certificates
        run: |
          docker network create harborbox-build || true
          ./scripts/gen-buildkit-certs.sh

      # Separately, and first: every network the builder container joins is a
      # network a caller's build step can reach, so it is deliberately alone in
      # its own project. tests/e2e_build_isolation.py measures that from inside
      # a real build step, which is the only place it can be measured.
      - name: Start the builder
        run: docker compose -f compose.builder.yaml up -d --wait

      - name: Start the stack
        run: docker compose up -d --wait

      # --capture=tee-sys, not the default: pytest replays a test's stdout only
      # when it fails, so e2e_pause_ladder's measured transition times -- the
      # entire reason that suite exists -- were invisible on a green run, and
      # e2e_smoke's own summary print had the same problem. tee-sys passes
      # output through to the job log *and* keeps capturing it, so the json
      # report is unaffected.
      - name: Run the e2e suites
        run: >-
          uv run pytest -m e2e --capture=tee-sys
          --json-report --json-report-file=e2e-results.json

      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail 300
          docker compose -f compose.builder.yaml logs --no-color --tail 100

      # `docker compose logs` above only covers this compose project's own
      # services (postgres, opensandbox, api). The actual sandbox containers
      # -- where a template's entrypoint, including the Jupyter server, runs
      # -- are spawned by the opensandbox server directly against the host
      # Docker socket (compose.yaml mounts it into the opensandbox service),
      # so they are not part of this compose project and were invisible to
      # that step.
      #
      # Known limitation, not a bug: this step runs after `pytest -m e2e`
      # has already finished, so any e2e test's own `finally: sandbox.kill()`
      # has already torn its sandboxes down before this ever runs. It cannot
      # capture a sandbox's logs while the sandbox still exists -- do not
      # expect it to explain a running test's own in-flight behaviour.
      #
      # What it demonstrated instead, once added (task 21, round 5): after
      # the e2e_smoke::test_two_sandboxes_run_code_in_parallel failure, this
      # step's `docker ps -a` output showed no sandbox container on the
      # runner at all -- not even an exited one, alongside this compose
      # project's three services and unrelated host containers. Combined
      # with the API's own `[DOCKER::SANDBOX_NOT_FOUND]` error, that ruled
      # out "a slow Jupyter kernel inside a container that is still there"
      # (the prior working theory) in favour of "the sandbox is gone from
      # OpenSandbox entirely" -- see the xfail on that test for what is
      # still unresolved. `docker ps -a` lists every container on the
      # runner, including already-exited ones, which is what made that
      # absence itself the evidence; anything not matching this compose
      # project's three named services would be a sandbox container
      # opensandbox spawned, named with its own OpenSandbox UUID (not the
      # `harborbox-{sandbox.id}` form, which is the Docker-runtime backend's
      # naming and is not what this job's HARBORBOX_RUNTIME_PROVIDER=opensandbox
      # config uses). `--tail` bounds each container's output so one stuck
      # or noisy sandbox cannot flood the job log, for whenever one is
      # actually still present to inspect.
      - name: Sandbox container logs on failure
        if: failure()
        run: |
          set -uo pipefail
          echo "All containers on the runner:"
          docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}'
          sandbox_containers=$(docker ps -a --format '{{.Names}}' \
            | grep -Ev '^harborbox-(postgres|opensandbox|api)-[0-9]+$' || true)
          if [ -z "$sandbox_containers" ]; then
            echo "No sandbox containers found on the runner."
            exit 0
          fi
          for name in $sandbox_containers; do
            echo "::group::docker logs $name"
            docker logs --timestamps --tail 500 "$name" 2>&1 \
              || echo "(could not fetch logs for $name)"
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          docker compose -f compose.builder.yaml down -v

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: e2e-results.json
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Results report
    if: always()
    needs: [test, e2e]
    runs-on: [self-hosted, onvo-ci]
    # pull-requests: write is only for the sticky comment. The default token is
    # read-only here, so without it the comment step 403s while every other step
    # passes — which reads as "the comment is broken" rather than "missing scope".
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Download unit reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: unit-reports
          path: .

      - name: Download e2e reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-reports
          path: .

      - name: Build the report
        run: |
          uv run python scripts/ci_report.py > ci-report.md
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // This marker string is the contract that lets this job find and
            // update its own previous comment (see "mine" below). It must
            // stay stable - there is no other copy of it anywhere else.
            const marker = '<!-- harborbox-ci-report -->';
            const body = marker + '\n' + fs.readFileSync('ci-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            // Update in place rather than appending a comment per push, so a
            // long-lived PR does not accumulate a dozen stale tables. The HTML
            // marker is how we find our own comment again.
            const existing = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const mine = existing.find((c) => c.body?.startsWith(marker));

            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
