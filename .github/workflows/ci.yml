name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    # Self-hosted for the reason onvo's ci.yml documents: the org's Actions
    # spend is blocked, so every GitHub-hosted job fails in ~2s with "recent
    # account payments have failed". Self-hosted runners are not billed.
    runs-on: [self-hosted, onvo-ci]
    permissions:
      contents: read

    # postgres_pool_store.py uses dialects.postgresql.insert and
    # with_for_update(skip_locked=True). SQLite cannot execute either, so its
    # tests need the real thing rather than a fake session.
    #
    # No test uses this service or HARBORBOX_TEST_DATABASE_URL yet - both
    # arrive with the coverage branch (postgres_pool_store.py coverage). Not
    # dead configuration, just not wired up yet.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harborbox
          POSTGRES_PASSWORD: harborbox
          POSTGRES_DB: harborbox_test
        options: >-
          --health-cmd "pg_isready -U harborbox"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]

    env:
      HARBORBOX_TEST_DATABASE_URL: postgresql+asyncpg://harborbox:harborbox@127.0.0.1:5432/harborbox_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy

      # Tests are a blocking gate: a failing test fails this job. Coverage is
      # measured and reported (see the PR comment) but not yet enforced -
      # `[tool.coverage.report]` in pyproject.toml sets no fail_under, so the
      # command can't fail on coverage regardless. `if: always()` keeps
      # coverage measurement running even if Lint or Typecheck failed above,
      # so the PR comment still has numbers to show.
      - name: Tests and coverage
        if: always()
        run: >-
          uv run pytest --cov --cov-report=json --cov-report=term-missing
          --json-report --json-report-file=unit-results.json

      # The backlog behind the ignore list, printed on every run rather than
      # discovered by someone going looking. Expected to be non-zero: it is the
      # docstring, copyright and formatter-conflict families, by design.
      - name: Lint backlog (non-blocking)
        if: always()
        run: uv run ruff check --select ALL --output-format=json -o ruff-strict.json . || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: |
            coverage.json
            unit-results.json
            ruff-strict.json
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E (Compose)
    runs-on: [self-hosted, onvo-ci]
    timeout-minutes: 40
    permissions:
      contents: read
    # Temporary deferral, not a permanent downgrade: the e2e suite is expected
    # to be a blocking gate and this line should come out as soon as the fixes
    # below land. Tracked as Task 21 in
    # docs/superpowers/plans/2026-08-14-strict-lint-full-coverage-ci.md. A live run against the real
    # stack turned up 5 genuine failures, none of them stale-test flakiness:
    #   - two 409 Conflicts on PUT /v1/sandboxes/{id}/files/content
    #   - a TimeoutError in the parallel-execution smoke test
    #   - an idle-timeout race asserting 'created' == 'running'
    #   - an OOM test that gets SandboxUnavailable where it expects
    #     MemoryLimitExceeded
    # The OOM one is the one to worry about: it looks like a real product
    # defect, not a bad assertion. OpenSandboxRuntime._raise_runtime_error
    # decides "this was a memory kill" by substring-matching "oom",
    # "out of memory", or "exit code 137" against the SDK exception text, but
    # the SDK's actual error codes never contain any of those strings, so the
    # branch can never fire and callers get the generic SandboxUnavailable
    # instead of MemoryLimitExceeded.
    # None of this was caught earlier because the e2e suite had not run at all
    # since the `template` field became required — every create() call broke
    # before any of these five code paths was ever exercised.
    continue-on-error: true

    # The runner is 2 cores / 3.7GB. The warm pool alone wants 2x256MB plus
    # 1x1024MB of sandboxes at boot, which is tight enough to tip api into
    # "unhealthy" on its own even once the images below exist. Disabling it
    # keeps the stack lean; the e2e tests create the sandboxes they need.
    env:
      HARBORBOX_WARM_POOL_ENABLED: "false"
      # The stack is built, started, tested against, and torn down entirely
      # within this job, and is never reachable from outside the runner. The
      # key only has to match on both sides (compose's api service and the
      # pytest client) — a repository secret would buy no security here, just
      # an extra manual setup step and an ambient credential.
      HARBORBOX_API_KEY: local-e2e-only-not-a-real-credential

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # compose.yaml puts the three sandbox template images behind
      # `profiles: ["build"]` to keep them out of the normal runtime stack, but
      # that also means a plain `docker compose build` silently skips them —
      # leaving the warm pool with no images to start from. --profile build
      # pulls them back in for this build-only invocation.
      - name: Build the stack
        run: docker compose --profile build build

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Run the e2e suites
        run: uv run pytest -m e2e --json-report --json-report-file=e2e-results.json

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300

      # `docker compose logs` above only covers this compose project's own
      # services (postgres, opensandbox, api). The actual sandbox containers
      # -- where a template's entrypoint, including the Jupyter server, runs
      # -- are spawned by the opensandbox server directly against the host
      # Docker socket (compose.yaml mounts it into the opensandbox service),
      # so they are not part of this compose project and were invisible to
      # that step. That is exactly why the unexplained
      # e2e_smoke::test_two_sandboxes_run_code_in_parallel failure (task 21:
      # a snapshot-restored sandbox's Jupyter kernel never answers readiness
      # probes, cause unconfirmed) has stayed undiagnosable from CI logs
      # alone -- nothing ever captured what Jupyter itself logged inside the
      # sandbox. `docker ps -a` lists every container on the runner,
      # including already-exited ones; anything that is not one of this
      # compose project's three named services is a sandbox container
      # opensandbox spawned, named with its own OpenSandbox UUID (not the
      # `harborbox-{sandbox.id}` form, which is the Docker-runtime backend's
      # naming and is not what this job's HARBORBOX_RUNTIME_PROVIDER=opensandbox
      # config uses). `--tail` bounds each container's output so one stuck
      # or noisy sandbox cannot flood the job log.
      - name: Sandbox container logs on failure
        if: failure()
        run: |
          set -uo pipefail
          echo "All containers on the runner:"
          docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}'
          sandbox_containers=$(docker ps -a --format '{{.Names}}' \
            | grep -Ev '^harborbox-(postgres|opensandbox|api)-[0-9]+$' || true)
          if [ -z "$sandbox_containers" ]; then
            echo "No sandbox containers found on the runner."
            exit 0
          fi
          for name in $sandbox_containers; do
            echo "::group::docker logs $name"
            docker logs --timestamps --tail 500 "$name" 2>&1 \
              || echo "(could not fetch logs for $name)"
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: e2e-results.json
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Results report
    if: always()
    needs: [test, e2e]
    runs-on: [self-hosted, onvo-ci]
    # pull-requests: write is only for the sticky comment. The default token is
    # read-only here, so without it the comment step 403s while every other step
    # passes — which reads as "the comment is broken" rather than "missing scope".
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Download unit reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: unit-reports
          path: .

      - name: Download e2e reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-reports
          path: .

      - name: Build the report
        run: |
          uv run python scripts/ci_report.py > ci-report.md
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // This marker string is the contract that lets this job find and
            // update its own previous comment (see "mine" below). It must
            // stay stable - there is no other copy of it anywhere else.
            const marker = '<!-- harborbox-ci-report -->';
            const body = marker + '\n' + fs.readFileSync('ci-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            // Update in place rather than appending a comment per push, so a
            // long-lived PR does not accumulate a dozen stale tables. The HTML
            // marker is how we find our own comment again.
            const existing = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const mine = existing.find((c) => c.body?.startsWith(marker));

            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
