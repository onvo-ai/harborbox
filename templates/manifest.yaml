version: 2

# The one statically registered template. Harborbox used to declare a template
# per product here, each with its own dependency file in this repository; that
# put every product's upgrades behind a Harborbox release. Products now own a
# Dockerfile and POST it to /v1/templates, which is the only way to build.
#
# This entry exists because a sandbox must name a template, because a build
# needs something to start FROM, and because a warm pool needs a template to
# pool. Sizing is the deployment default; a product's own template carries its
# own, taken from the request that created it.
templates:
  base:
    image: harborbox-sandbox-base
    dockerfile: sandbox/Dockerfile
    memory_mb: 512
    cpu: 1.0
    warm_pool: 1
    purpose: Minimal Debian base with the sandbox user and /workspace

# Warm pools are keyed by template name (HARBORBOX_WARM_POOL), so a product's
# own `custom-<hash>` template can be pooled the same way this one is. Warm
# starts are worth roughly 3 seconds, which is too much to reserve for the
# base image nobody runs directly.
