version: 1

# Statically registered base templates. These are configuration, not database
# rows: they are built ahead of time by scripts/build-templates.sh and are the
# only templates that get a warm pool.
#
# Derived templates are created at runtime through POST /v1/templates, which
# layers allowlisted apt/npm packages and env vars on top of one of these bases
# and names the result <base>-<12 hex chars of the canonical spec digest>. They
# live in the sandbox_templates table, cold-start by design, and are reclaimed
# by the image collector after HARBORBOX_TEMPLATE_GC_MAX_IDLE_DAYS of disuse.
templates:
  relaydeck:
    image: harborbox-sandbox-relaydeck
    dockerfile: sandbox/Dockerfile.relaydeck
    memory_mb: 256
    cpu: 0.5
    warm_pool: 2
    purpose: Lightweight CLI and stdio MCP execution
  onvo-pro:
    image: harborbox-sandbox-onvo-pro
    dockerfile: sandbox/Dockerfile
    requirements: sandbox/requirements-onvo-pro.txt
    memory_mb: 1024
    cpu: 2
    warm_pool: 1
    purpose: Python jobs with pandas and NumPy
  onvo-lite:
    image: harborbox-sandbox-onvo-lite
    dockerfile: sandbox/Dockerfile
    requirements: sandbox/requirements-onvo-lite.txt
    memory_mb: 1024
    cpu: 2
    warm_pool: 0
    purpose: Data connectors and database packages

# Packages a derived template may layer on top of a base. Every name is verified
# against Debian bookworm, which is what all three bases are built from.
# Override with HARBORBOX_TEMPLATE_APT_ALLOWLIST / _NPM_ALLOWLIST.
derived_allowlists:
  apt:
    - ca-certificates
    - chromium
    - default-mysql-client
    - fonts-liberation
    - fonts-noto-core
    - postgresql-client
    - redis-tools
  npm:
    - "@playwright/mcp"
