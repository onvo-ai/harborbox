# Harborbox on Onvo's `internal-tools` host, alongside the Trigger.dev stack.
#
# The only consumer is Trigger.dev task code executing widget Python. Those task
# runners are containers on the Trigger stack's own Docker network, so the API
# joins that network as an external and is reachable at `http://harborbox:8000`.
# Nothing is published to the host or to the internet.
#
# Two deliberate differences from compose.yaml:
#
#   1. `HARBORBOX_SANDBOX_EGRESS_NETWORK` is empty, so sandboxes sit only on the
#      `internal: true` network and have no route anywhere. Onvo's worker
#      downloads datasource CSVs and passes them in as files, so widget code
#      never needs to fetch anything. If that ever changes, the sandbox needs
#      egress and this comment is the thing that was wrong.
#
#   2. No published port. compose.yaml binds 127.0.0.1 for local development;
#      here the API must not be reachable from the host at all.
#
# Memory is the binding constraint on this host (~6 GB available), not disk.
# api 768M + postgres 512M + opensandbox 768M + 2 concurrent sandboxes at
# 768M ≈ 3.6 GB, plus 2 warm onvo-pro holding 1.5 GB of reservation.
#
# Since 0.2.0 this runs `opensandbox/server`, as compose.yaml does. That is not
# optional: 0.2.0's template images ship no harborbox agent — no fastapi, no
# uvicorn, `CMD ["tail","-f","/dev/null"]` — because execd runs the code, so
# the old DockerRuntime path has nothing to talk to.
#
# The API no longer holds the docker socket. Template images are built on the
# rootless `builder`, and the results land in the local `registry` rather than
# in this host's image store. opensandbox still holds the socket -- something
# has to create sandbox containers -- but the control plane does not.
#
# **The builder is no longer part of this application.** It is a second Coolify
# application, deployed from compose.builder.yaml onto this same host, and the
# reason is measured rather than theoretical: Coolify appends its project
# network to every service of a compose application, and a build step runs
# inside buildkitd's network namespace. While `builder` was a service here, a
# caller's `RUN` could reach `api:8000`, `opensandbox:8080` and `postgres:5432`
# -- verified from inside the builder container on this host. Nothing in a
# compose file prevents that attachment (`connect_to_docker_network` was
# already false), so the builder was moved into a project where the attachment
# reaches nothing. See compose.builder.yaml and
# docs/arbitrary-dockerfile-templates.md section 10.3.
#
# What crosses the two applications:
#   - the external `harborbox-build` network, joined here by `registry` and
#     `buildkit-gateway` and there by `builder`;
#   - `harborbox-buildkit-tls-client`, the client half of the mutual-TLS pair
#     the API needs to drive buildkitd over TCP, written by
#     scripts/gen-buildkit-certs.sh.
# Both must exist before this application starts.
#
# This host ships one image, not three. Products own a Dockerfile and POST it
# to /v1/templates, which is the only way to build.

name: harborbox

configs:
  # A TCP passthrough to the buildkitd that now runs in the other application.
  # Identical to compose.yaml's; see the long note there for why the API cannot
  # simply join the build network to reach it. In short: every network the
  # builder joins is one a caller's `RUN` can reach, so the API stays off that
  # network and this dual-homed proxy carries the connection across. It
  # terminates nothing -- buildkitd's mutual TLS is what makes reaching the
  # port different from being able to build.
  buildkit-gateway-config:
    content: |
      global
        log stdout format raw local0 info
        # Without an explicit cap haproxy sizes its connection tables from the
        # container's file-descriptor ulimit, which Docker sets to something
        # enormous, and the worker is OOM-killed at boot inside this memory
        # limit -- `exited with code 137` in a restart loop, with no mention of
        # memory anywhere in its own log. The API runs at most
        # HARBORBOX_TEMPLATE_MAX_CONCURRENT_BUILDS connections through here.
        maxconn 256

      defaults
        mode tcp
        log global
        option tcplog
        timeout connect 10s
        # Longer than HARBORBOX_TEMPLATE_BUILD_TIMEOUT_SECONDS: one build is
        # one connection, and cutting it here surfaces as an unexplained gRPC
        # error rather than as a build timeout.
        timeout client 2h
        timeout server 2h

      # Without this haproxy resolves `builder` once at startup and keeps the
      # address forever, so the first redeploy of the builder application --
      # which is now a separate application, redeployed on its own schedule --
      # would silently break every build until this container restarted too.
      resolvers docker
        nameserver embedded 127.0.0.11:53
        resolve_retries 3
        timeout resolve 1s
        timeout retry 1s
        hold valid 10s
        hold nx 1s
        hold other 1s

      frontend buildkit
        bind :1234
        default_backend builder

      backend builder
        # init-addr libc,none: start even when the builder application is not
        # up. The two are deployed independently and in either order.
        server builder builder:1234 resolvers docker init-addr libc,none

  # Mirrors compose.yaml's config, with two deliberate differences for this
  # host: no egress section, because sandboxes here must reach nothing, and a
  # narrower port range, since the Trigger stack shares these ephemeral ports.
  opensandbox-config:
    content: |
      [server]
      host = "0.0.0.0"
      port = 8080
      max_sandbox_timeout_seconds = 86400

      [log]
      level = "INFO"

      [runtime]
      type = "docker"
      execd_image = "opensandbox/execd:v1.0.21"

      [store]
      type = "sqlite"
      path = "/var/lib/opensandbox/opensandbox.db"

      [docker]
      network_mode = "bridge"
      host_ip = "host.docker.internal"
      port_range_min = 40000
      port_range_max = 45000
      drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
      no_new_privileges = true
      pids_limit = 4096

      [ingress]
      mode = "direct"

services:
  # The one image this repository builds. Harborbox used to build a tailored
  # image per product here, each pinning that product's Python dependencies in
  # the Harborbox repo; products own a Dockerfile and POST it now.
  #
  # It still idles rather than exiting, and that is deliberate. Coolify's
  # forced cleanup on `0 0 * * *` prunes stopped containers and then runs
  # `docker image prune -af`, deleting every image no container refers to.
  # Nothing refers to this one: sandboxes are created from it by name through
  # opensandbox, which is a `docker create`, not a standing reference. A
  # *running* container is the reference prune honours. Less critical than it
  # was -- the image now comes back from the registry rather than being lost --
  # but a nightly re-pull is still pointless.
  sandbox-base-image:
    image: 127.0.0.1:${HARBORBOX_REGISTRY_PORT:-5050}/harborbox-sandbox-base:${HARBORBOX_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    mem_limit: 32m

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: harborbox
      POSTGRES_USER: harborbox
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_HARBORBOXDB}
    volumes:
      - harborbox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harborbox -d harborbox"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    restart: unless-stopped
    networks:
      - control

  # Holds every template image the API builds. Two consumers reach it by two
  # different addresses: BuildKit pushes over the `build` network, and the
  # host's Docker daemon pulls through the published port when opensandbox
  # creates a sandbox. Loopback only -- nothing off-host has business here, and
  # 127.0.0.1 is also what lets the daemon accept plain HTTP without editing
  # its `insecure-registries`.
  #
  # Delete must be enabled or the template collector reclaims nothing; it
  # removes manifests, and the registry frees the blobs on its own
  # `garbage-collect` pass.
  # See compose.yaml: the htpasswd is generated into a volume at boot rather
  # than bound from `./auth`, which is gitignored and so absent on any host
  # that has not run the local script -- Docker then binds an empty directory
  # and the registry crash-loops on the missing file.
  registry-auth:
    image: httpd:2-alpine
    command:
      - sh
      - -c
      - htpasswd -Bbn "$$REGISTRY_USERNAME" "$$REGISTRY_PASSWORD" > /auth/htpasswd
    environment:
      REGISTRY_USERNAME: ${HARBORBOX_REGISTRY_USERNAME:-harborbox}
      REGISTRY_PASSWORD: ${HARBORBOX_REGISTRY_PASSWORD:?set a registry password}
    volumes:
      - harborbox-registry-auth:/auth
    restart: "no"
    # No network: it hashes a string and writes a file. See compose.yaml.
    network_mode: none

  registry:
    image: registry:3
    depends_on:
      registry-auth:
        condition: service_completed_successfully
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - harborbox-registry-auth:/auth:ro
      - harborbox-registry:/var/lib/registry
    ports:
      - "127.0.0.1:${HARBORBOX_REGISTRY_PORT:-5050}:5000"
    healthcheck:
      test: ["CMD", "/bin/registry", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 256
    restart: unless-stopped
    networks:
      # Dual-homed on purpose. `build` is how BuildKit pushes; `control` is how
      # the API deletes manifests when the template collector reclaims an image.
      # Docker does not route between bridge networks, so this does not let the
      # builder reach anything on `control`.
      - build
      - control

  # The API's route to buildkitd, which runs in the other Coolify application.
  #
  # `builder` was a service here and the API drove it over a unix socket in a
  # shared volume. That is the strongest form of the isolation -- no shared
  # network at all -- and on this host it was not what was actually running:
  # Coolify's project network put the builder next to `api`, `opensandbox` and
  # `postgres`, all three of which answered from inside a build step. A socket
  # cannot cross Compose projects, so moving the builder into its own
  # application costs the socket and buys back the isolation.
  #
  # Dual-homed exactly as the registry above is, and safe for the same reason:
  # Docker does not route between bridge networks, so a build step that reaches
  # this container reaches this listener and nothing behind it. The listener
  # leads only to buildkitd, which requires a client certificate that lives in
  # a volume no build step can mount.
  buildkit-gateway:
    image: haproxy:3.2-alpine
    configs:
      - source: buildkit-gateway-config
        target: /usr/local/etc/haproxy/haproxy.cfg
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
    restart: unless-stopped
    networks:
      # Aliases for the reason the api service documents below: Coolify's
      # compose rewriter drops service network entries whose value is null,
      # which would leave this on neither network and every build unroutable.
      build:
        aliases:
          - harborbox-buildkit-gateway
      control:
        aliases:
          - buildkit-gateway

  opensandbox:
    image: opensandbox/server:v0.2.2
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_SERVER_API_KEY: ${SERVICE_PASSWORD_64_OPENSANDBOXAPI:?see the API service below - the same key must reach both sides.}
    configs:
      - source: opensandbox-config
        target: /etc/opensandbox/config.toml
    volumes:
      # Same privilege as the API had, for the same reason: something has to
      # create sandbox containers. Under 0.2.0 that is opensandbox, not the API.
      - /var/run/docker.sock:/var/run/docker.sock
      - opensandbox-state:/var/lib/opensandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 512
    restart: unless-stopped
    networks:
      control:
        aliases:
          - opensandbox

  api:
    image: harborbox-api:${HARBORBOX_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      # `service_started`, not `service_completed_successfully`: these three no
      # longer exit (see the note above them), and waiting for a container that
      # idles by design to complete would hang every deploy forever. Compose
      # builds all images before it starts any container, so a started keeper
      # already proves its image was built.
      sandbox-base-image:
        condition: service_started
      postgres:
        condition: service_healthy
      opensandbox:
        condition: service_healthy
    environment:
      HARBORBOX_API_KEY: ${SERVICE_PASSWORD_64_HARBORBOXAPI:?refusing to start with no API key - every sandbox call would 401. Set it in .env from Infisical Onvo/staging HARBORBOX_API_KEY.}
      HARBORBOX_DATABASE_URL: postgresql+asyncpg://harborbox:${SERVICE_PASSWORD_HARBORBOXDB}@postgres/harborbox
      # Telemetry, and the reason it is not optional here. Harborbox ran for
      # months emitting no span under any name, so the daily checkup's
      # "errors in the last 24h" query for `service.name = harborbox` returned
      # a structural zero and rendered it green -- a section that could not
      # fail. See DEV-1948.
      #
      # The public ingester rather than SigNoz over localhost. That is the
      # trade-off DEV-1829 settled for the host agents and it holds here for
      # the same reason: exporting to the box that runs SigNoz means a SigNoz
      # outage also loses the telemetry that would explain it. The address is
      # the current one -- anything written before 2026-08-07 points at
      # 91.99.169.190:4317, where nothing has listened since, and an OTLP
      # exporter fails silently against a dead endpoint.
      #
      # `production` is what puts the spans under the bare `harborbox` service
      # name the checkup queries, and what fills `deployment.environment` so
      # DEV-1824's production filter matches them.
      # `OPENTELEMETRY_ENDPOINT` and `SIGNOZ_INGESTION_KEY` are the names the
      # rest of the estate already uses (onvo-pro, onvo-lite, the website), so
      # this reads the same Infisical entries rather than inventing a second
      # pair that can drift from them.
      HARBORBOX_ENVIRONMENT: ${HARBORBOX_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OPENTELEMETRY_ENDPOINT:-https://ingester.onvo.ai}
      # Sent to match every other exporting service, and deliberately *not*
      # required. The self-hosted ingester does not enforce it today: DEV-1858
      # closed on a bare unauthenticated `curl -X POST -d '{}'
      # https://ingester.onvo.ai/v1/traces` returning 200 five times running,
      # which is the exit criterion that whole incident was verified against.
      # Wiring the estate's variable in anyway costs nothing and makes turning
      # enforcement on later one Infisical entry rather than a code change.
      #
      # An unset key sends an empty token rather than no header, which the
      # exporter is happy with -- verified against a local collector.
      OTEL_EXPORTER_OTLP_HEADERS: signoz-access-token=${SIGNOZ_INGESTION_KEY:-}
      # The reason 0.2.0's first deploy failed here. Until 0.2.0 the API built
      # `DockerRuntime` directly in its lifespan and never read this setting, so
      # its `opensandbox` default was harmless. 0.2.0 routes through
      # `create_runtime()`, which honours it — and no opensandbox ran on this
      # host, so every create died at DNS with `[Errno -3] Temporary failure in
      # name resolution` before a container existed. Trigger saw "Harborbox
      # sandbox failed to become ready".
      #
      # Set explicitly rather than left to default, because the two halves of
      # this decision live in different files: change it to `docker` and the
      # opensandbox service below becomes dead weight, but the sandbox images
      # also stop working. 0.2.0's template images ship no agent — no fastapi,
      # no uvicorn, `CMD ["tail","-f","/dev/null"]` — because execd runs the
      # code. DockerRuntime polls a harborbox agent on :8080 that those images
      # do not contain, so `docker` needs different images, not just this flag.
      HARBORBOX_OPENSANDBOX_DOMAIN: opensandbox:8080
      HARBORBOX_OPENSANDBOX_PROTOCOL: http
      # opensandbox v0.2.2's proxy 500s on execd's streaming /code endpoint
      # ("An internal error occurred in the proxy") while /ping through the same
      # proxy is fine. Python execution therefore goes straight to the execd
      # port opensandbox publishes, which is what extra_hosts below is for.
      HARBORBOX_OPENSANDBOX_USE_SERVER_PROXY: "false"
      HARBORBOX_OPENSANDBOX_API_KEY: ${SERVICE_PASSWORD_64_OPENSANDBOXAPI:?refusing to start with no opensandbox key - the API would fail every sandbox create against the runtime.}
      # Static template images, built above. These three names are what
      # `image_for_template` resolves for onvo-pro/onvo-lite/relaydeck.
      # Derived templates are named `<base>-<12 hex>` and their image name is a
      # pure function of prefix + version, so these must match the tags built
      # above or a derived template resolves to an image nobody built.
      HARBORBOX_BASE_IMAGE: harborbox-sandbox-base:${HARBORBOX_IMAGE_TAG:-local}
      # Pools by template name. A product that wants its own image kept warm
      # adds it here: {"base":1,"custom-abc123def456":2}. Warm starts are worth
      # roughly 3 seconds, which is why this stayed configurable when products
      # stopped having a template each.
      HARBORBOX_WARM_POOL: ${HARBORBOX_WARM_POOL:-{"base":1}}
      #
      # Builds run on the rootless builder, which is the other Coolify
      # application, reached through the gateway above -- not on this
      # container's daemon, which it no longer has.
      #
      # TCP where this was a unix socket, and the certificates below are not
      # optional: Settings refuses to start with a tcp:// builder address and
      # no client certificate, because an unauthenticated buildkitd on TCP is
      # strictly worse than the socket it replaces. Everything that can reach
      # the gateway -- including a caller's build step -- could otherwise
      # build. Generate the pair with scripts/gen-buildkit-certs.sh.
      HARBORBOX_BUILDER_ADDRESS: tcp://buildkit-gateway:1234
      HARBORBOX_BUILDER_TLS_CA_CERT: /certs/buildkit/ca.pem
      HARBORBOX_BUILDER_TLS_CERT: /certs/buildkit/cert.pem
      HARBORBOX_BUILDER_TLS_KEY: /certs/buildkit/key.pem
      # Two addresses for one registry, and the difference is not cosmetic.
      # BuildKit dials it from the `build` network, so it uses the service
      # name. The reference the API stores is resolved by the *Docker daemon*
      # when opensandbox creates a sandbox, and the daemon is on the host,
      # where `registry` means nothing -- so the pull side goes through the
      # published port on loopback. Everything after the host part must stay
      # identical; see docs/arbitrary-dockerfile-templates.md section 10.3.
      HARBORBOX_REGISTRY_PUSH_ENDPOINT: registry:5000
      HARBORBOX_REGISTRY_PULL_ENDPOINT: 127.0.0.1:${HARBORBOX_REGISTRY_PORT:-5050}
      HARBORBOX_REGISTRY_USERNAME: ${HARBORBOX_REGISTRY_USERNAME:-harborbox}
      HARBORBOX_REGISTRY_PASSWORD: ${HARBORBOX_REGISTRY_PASSWORD:?set a registry password}
      # BuildKit has no implicit "localhost is insecure" rule the way the
      # Docker daemon does, so plain HTTP has to be declared.
      HARBORBOX_REGISTRY_INSECURE: "true"
      # Repository prefixes a product's `FROM` may name. What a build installs
      # is unbounded by construction; what it starts from is the control.
      HARBORBOX_TEMPLATE_FROM_ALLOWLIST: ${HARBORBOX_TEMPLATE_FROM_ALLOWLIST:-["docker.io/library"]}
      HARBORBOX_TEMPLATE_CONTEXT_ROOT: /var/lib/harborbox/build-contexts
      HARBORBOX_TEMPLATE_MAX_CONCURRENT_BUILDS: ${HARBORBOX_TEMPLATE_MAX_CONCURRENT_BUILDS:-2}
      HARBORBOX_TEMPLATE_IMAGE_PREFIX: harborbox-sandbox
      HARBORBOX_TEMPLATE_VERSION: ${HARBORBOX_IMAGE_TAG:-local}
      HARBORBOX_SANDBOX_NETWORK: ${HARBORBOX_SANDBOX_NETWORK:-harborbox-net}
      # Empty, matching the header: sandboxes sit only on the `internal: true`
      # network and have no route anywhere.
      #
      # This named `harborbox-egress` until 2026-08-05, and that network has
      # never existed on this host — `_connect_egress` does `networks.get(name)`
      # only after a caller opts in, so the first request to ask for egress
      # would have died on a Docker NotFound rather than being cleanly told no.
      # Empty takes the `if not network_name: return` path instead.
      #
      # To actually offer egress here, declare the network below and set this;
      # it is opt-in per sandbox (SandboxCreate.egress, default false), so
      # widget code is unaffected either way.
      HARBORBOX_SANDBOX_EGRESS_NETWORK: ${HARBORBOX_SANDBOX_EGRESS_NETWORK:-}
      HARBORBOX_DEFAULT_SANDBOX_MEMORY_MB: ${HARBORBOX_ONVO_SANDBOX_MEMORY_MB:-768}
      HARBORBOX_DEFAULT_SANDBOX_CPU: ${HARBORBOX_ONVO_SANDBOX_CPU:-1}
      HARBORBOX_MAX_SANDBOX_MEMORY_MB: ${HARBORBOX_MAX_SANDBOX_MEMORY_MB:-2048}
      # Raised from 8 to 10 to hold the old eight execution slots after the warm
      # pool started charging CPU. The host has 8 cores and shares them with the
      # Trigger stack, so this is deliberately an admission ceiling rather than
      # a promise of parallelism — the same over-commit the old pool made
      # implicitly by running four warm sandboxes outside the budget entirely.
      HARBORBOX_MAX_PARALLEL_CPU: ${HARBORBOX_MAX_PARALLEL_CPU:-10}
      HARBORBOX_MAX_CONCURRENT_EXECUTIONS_PER_SANDBOX: ${HARBORBOX_ONVO_CONCURRENCY:-2}
      # Warm pools. HARBORBOX_SANDBOX_POOL_SIZE used to sit here warming 4
      # sandboxes; that pool matched on (memory_mb, cpu, egress) and carried no
      # template, so it could hand an onvo-pro container to a relaydeck caller.
      # 0.2.0 replaced it with per-template pools, which is why they are named
      # individually now. They live in the opensandbox runtime, so they only
      # work at all because the provider above is `opensandbox`.
      #
      # Sized down from the old 4: each pooled onvo-pro holds a 768 MB
      # reservation, so 4 reserved 3 GB of the ~6 GB this host has. Only
      # onvo-pro is used here — Onvo's client sends it for every widget — so the
      # other two warm nothing rather than holding memory for callers that do
      # not exist.
      # One warm onvo-pro. Note the accounting difference from 0.1.0: that pool
      # held a memory reservation but deliberately no CPU budget, while 0.2.0's
      # reserves both (`capacity()` adds warm_pool.cpu to reserved_cpu), so each
      # warm sandbox costs a real admission slot.
      #
      # Sized at one rather than two because two bought nothing: a 43-widget
      # refresh measured 178s per batch at two slots-worth reserved and 190s
      # after freeing them, so admission was not the constraint. **0.2.0 is
      # still ~10x slower than 0.1.0 on this workload** (13-22s per batch
      # before), and the cause is per-sandbox startup, not queueing — an
      # isolated cold create-and-execute is ~6s while executions themselves run
      # in ~200ms. A burst of 43 widgets pays that startup 43 times. Unresolved.
      # Was 0, so every Lite sandbox cold-started — ~6.5s of provisioning on
      # the critical path of a user's first query. One warm slot covers the
      # common case of a single analysis at a time.
      #
      # Per-template sizing, pinned to what this host was already running.
      # 0.2.0 takes resources from the resolved template, not from
      # HARBORBOX_DEFAULT_SANDBOX_*, and onvo-pro's built-in default is
      # 1024 MB / 2.0 CPU. Left alone that silently halves concurrency here:
      # MAX_PARALLEL_CPU is 10, so 2.0 CPU per sandbox halves how many fit.
      # Onvo's widget code has run in 768 MB / 1 CPU all along.
      #
      # onvo-lite was never pinned, so it inherited the old 2.0 CPU default
      # while onvo-pro was pinned to 1.0 right above — the two Onvo sandboxes
      # were sized differently for no reason anyone had decided. Measured on a
      # real datasource analysis, DuckDB profiling took ~2.5s at 1.0 CPU and the
      # run was dominated by the model, not compute. At 2.0 the host fits two
      # concurrent Lite analyses; at 1.0 it fits four.
      HARBORBOX_DEFAULT_IDLE_TIMEOUT_SECONDS: ${HARBORBOX_ONVO_IDLE_TIMEOUT_SECONDS:-180}
      # Leave headroom for the Trigger stack, which shares this host.
      HARBORBOX_HOST_MEMORY_RESERVE_PERCENT: ${HARBORBOX_HOST_MEMORY_RESERVE_PERCENT:-25}
      HARBORBOX_PLATFORM_MEMORY_RESERVE_MB: ${HARBORBOX_PLATFORM_MEMORY_RESERVE_MB:-1024}
    extra_hosts:
      # Reaching the published execd port needs the host gateway; see
      # HARBORBOX_OPENSANDBOX_USE_SERVER_PROXY above.
      - "host.docker.internal:host-gateway"
    volumes:
      # A client certificate, and only that. This replaces the docker socket
      # the API used to hold: it can ask for an image build, and it cannot
      # start a container on this host. Read-only, and it is the client half of
      # the pair only -- buildkitd's own key is in a volume this application
      # does not mount.
      # Bind mount for the reason given in compose.builder.yaml: a named
      # volume gets namespaced by Coolify and silently arrives empty.
      # No `${VAR:-default}` here. Coolify splits a volume string on `:`
      # before interpolating it, so the `:-` inside a default lands in the
      # middle of source:target:mode and the deploy dies on
      #   invalid spec: /data/harborbox/buildkit-tls:: empty section between colons
      # Ports tolerate the same syntax; volumes do not. The variable is
      # therefore required -- set it on both applications, and see
      # .env.example.
      # A literal absolute path, deliberately. Coolify does not interpolate
      # environment variables in a volume source -- it substituted the
      # *name* and produced a named volume called
      # `harborbox-buildkit-tls-dirserver` -- and it splits the string on
      # `:` before interpolation, so a `${VAR:-default}` breaks the parse
      # outright. Ports accept both; volumes accept neither. Local runs use
      # compose.builder.local.yaml, which overrides this to a checkout path.
      - /data/harborbox/buildkit-tls/client:/certs/buildkit:ro
      # buildctl streams `--local` directories from the client, so uploaded
      # build contexts belong to this container, not to the builder.
      - harborbox-contexts:/var/lib/harborbox/build-contexts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
    restart: unless-stopped
    labels:
      # Publishes exactly one path — GET /health — at harborbox.onvo.ai, so
      # Uptime Kuma can probe it from another host. Everything else stays
      # unroutable from the internet: the rule uses `Path`, which is an exact
      # match, not `PathPrefix`. Do not relax it to PathPrefix(`/`) — this API
      # holds the docker socket, and /v1/sandboxes would then be one guessed
      # HARBORBOX_API_KEY away from arbitrary code execution on this host.
      #
      # Router names are explicit and unique (`harborbox-health`) because
      # Coolify generates its own `http-0-<uuid>` / `https-0-<uuid>` routers
      # and will clobber same-named ones on redeploy.
      #
      # traefik.docker.network is required: this container sits on four
      # networks and Traefik picks one arbitrarily without it. It must name the
      # network coolify-proxy actually shares with the API.
      - traefik.enable=true
      - traefik.docker.network=u95r9dynmb7i2kn945n61qiq
      - traefik.http.routers.harborbox-health.rule=Host(`harborbox.onvo.ai`) && Path(`/health`)
      - traefik.http.routers.harborbox-health.entryPoints=https
      - traefik.http.routers.harborbox-health.tls=true
      - traefik.http.routers.harborbox-health.tls.certresolver=letsencrypt
      - traefik.http.routers.harborbox-health.service=harborbox-health
      - traefik.http.services.harborbox-health.loadbalancer.server.port=8000
      #
      # There is deliberately no second router here. A `harborbox-api` router
      # once published /v1 at harborbox-api.onvo.ai for Onvo Lite, back when
      # Lite ran its Python from onvo-production and could not reach the
      # internal http://harborbox:8000. Lite's sandbox calls now run as
      # Trigger.dev tasks on this host, where apps/lite/trigger.config.ts sets
      # HARBORBOX_URL=http://harborbox-next:8000 -- a Docker alias on the
      # Trigger stack's private network. Nothing has needed the public route
      # since, and its DNS record no longer exists (harborbox-api.onvo.ai is
      # NXDOMAIN), so the router was matching a hostname that cannot arrive.
      #
      # Do not re-add it to give something off-host access to /v1 without
      # reading the warning above first. This API holds the docker socket, so
      # a reachable /v1 is an arbitrary-code-execution surface. The removed
      # router only survived review because it carried three separate
      # controls: a DNS-only (grey-cloud) hostname, so Traefik saw real
      # source addresses rather than Cloudflare's; an ipAllowList pinned to
      # the Lite hosts; and PathPrefix(`/v1`), keeping /openapi.json and
      # /docs unroutable. Joining the caller to a Docker network is cheaper
      # and safer than reproducing all three.
    networks:
      # Each entry carries an alias deliberately. Coolify's compose rewriter
      # drops service network entries whose value is null, which silently left
      # the API on neither the control nor the sandbox network — it came up
      # healthy and could not reach a single sandbox it created. An alias is
      # the smallest thing that makes the entry survive the rewrite.
      control:
        aliases:
          - harborbox-control
      sandboxes:
        aliases:
          - harborbox-sandboxes
      # The Trigger stack's network. `harborbox` is the name task code uses;
      # a parallel deploy takes a different alias so Docker DNS does not
      # round-robin between two stacks.
      trigger:
        aliases:
          - ${HARBORBOX_NETWORK_ALIAS:-harborbox}

volumes:
  harborbox-postgres:
  opensandbox-state:
  harborbox-registry:
  harborbox-registry-auth:
  harborbox-contexts:

networks:
  control:
  # The registry, the buildkit gateway, and -- from the other Coolify
  # application -- the builder. Nothing else, ever: a build step runs inside
  # buildkitd's network namespace, so every member of this network is something
  # a product-supplied `RUN` can reach.
  #
  # External for the same reason `sandboxes` is: Coolify rewrites managed
  # network definitions, and this one has to be the same bridge in two
  # applications. Created once, out of band, with:
  #   docker network create harborbox-build
  #
  # Spelled literally rather than through a variable, in all three compose
  # files: two applications have to name the same bridge, and a variable set in
  # one and not the other produces two networks and a build that cannot find
  # the builder.
  build:
    name: harborbox-build
    external: true
  # Declared external because Coolify rewrites managed network definitions and
  # silently dropped this one — the API then created sandboxes against a network
  # that did not exist, and every sandbox went straight to `failed` with nothing
  # in the API log to say why. Created once out of band with:
  #   docker network create --internal harborbox-net
  sandboxes:
    name: ${HARBORBOX_SANDBOX_NETWORK:-harborbox-net}
    external: true
  trigger:
    name: nj9nsajrgcu76alcj6c1sq87
    external: true
