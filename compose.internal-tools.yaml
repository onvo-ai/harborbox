# Harborbox on Onvo's `internal-tools` host, alongside the Trigger.dev stack.
#
# The only consumer is Trigger.dev task code executing widget Python. Those task
# runners are containers on the Trigger stack's own Docker network, so the API
# joins that network as an external and is reachable at `http://harborbox:8000`.
# Nothing is published to the host or to the internet.
#
# Two deliberate differences from compose.yaml:
#
#   1. `HARBORBOX_SANDBOX_EGRESS_NETWORK` is empty, so sandboxes sit only on the
#      `internal: true` network and have no route anywhere. Onvo's worker
#      downloads datasource CSVs and passes them in as files, so widget code
#      never needs to fetch anything. If that ever changes, the sandbox needs
#      egress and this comment is the thing that was wrong.
#
#   2. No published port. compose.yaml binds 127.0.0.1 for local development;
#      here the API must not be reachable from the host at all.
#
# Memory is the binding constraint on this host (~6 GB available), not disk.
# api 768M + postgres 512M + 2 concurrent sandboxes at 1 GB ≈ 3.3 GB.

name: harborbox

services:
  sandbox-image:
    # Tagged, because a second deploy on this host builds the same names.
    # Left at `local` the Coolify build would retag the image the hand-rolled
    # stack launches sandboxes from, changing it without anyone deciding to.
    image: harborbox-sandbox-onvo:${HARBORBOX_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: sandbox/Dockerfile
      args:
        SANDBOX_REQUIREMENTS: sandbox/requirements-onvo.txt
    entrypoint: ["/bin/true"]
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: harborbox
      POSTGRES_USER: harborbox
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_HARBORBOXDB}
    volumes:
      - harborbox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harborbox -d harborbox"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    restart: unless-stopped
    networks:
      - control

  api:
    image: harborbox-api:${HARBORBOX_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      HARBORBOX_API_KEY: ${SERVICE_PASSWORD_64_HARBORBOXAPI:?refusing to start with no API key - every sandbox call would 401. Set it in .env from Infisical Onvo/staging HARBORBOX_API_KEY.}
      HARBORBOX_DATABASE_URL: postgresql+asyncpg://harborbox:${SERVICE_PASSWORD_HARBORBOXDB}@postgres/harborbox
      HARBORBOX_SANDBOX_IMAGE: harborbox-sandbox-onvo:${HARBORBOX_IMAGE_TAG:-local}
      HARBORBOX_SANDBOX_NETWORK: ${HARBORBOX_SANDBOX_NETWORK:-harborbox-net}
      # Named, but only attached to sandboxes that ask for it (SandboxCreate
      # .egress, default false). Widget code is handed its data as files and
      # never opts in, so it stays unable to reach anything; a caller that must
      # talk to a customer database can request it explicitly.
      HARBORBOX_SANDBOX_EGRESS_NETWORK: ${HARBORBOX_SANDBOX_EGRESS_NETWORK:-harborbox-egress}
      HARBORBOX_DEFAULT_SANDBOX_MEMORY_MB: ${HARBORBOX_ONVO_SANDBOX_MEMORY_MB:-768}
      HARBORBOX_DEFAULT_SANDBOX_CPU: ${HARBORBOX_ONVO_SANDBOX_CPU:-1}
      HARBORBOX_MAX_SANDBOX_MEMORY_MB: ${HARBORBOX_MAX_SANDBOX_MEMORY_MB:-2048}
      HARBORBOX_MAX_PARALLEL_CPU: ${HARBORBOX_MAX_PARALLEL_CPU:-8}
      HARBORBOX_MAX_CONCURRENT_EXECUTIONS_PER_SANDBOX: ${HARBORBOX_ONVO_CONCURRENCY:-2}
      # Pre-started sandboxes kept ready. The container is ~2.6s of a sandbox's
      # cost and ~0.1s of its work, so a caller that starts its own pays the
      # boot on the critical path. Pooled sandboxes hold their memory
      # reservation but no CPU budget - see RESERVED_SANDBOX_STATES.
      HARBORBOX_SANDBOX_POOL_SIZE: ${HARBORBOX_SANDBOX_POOL_SIZE:-4}
      HARBORBOX_DEFAULT_IDLE_TIMEOUT_SECONDS: ${HARBORBOX_ONVO_IDLE_TIMEOUT_SECONDS:-180}
      # Leave headroom for the Trigger stack, which shares this host.
      HARBORBOX_HOST_MEMORY_RESERVE_PERCENT: ${HARBORBOX_HOST_MEMORY_RESERVE_PERCENT:-25}
      HARBORBOX_PLATFORM_MEMORY_RESERVE_MB: ${HARBORBOX_PLATFORM_MEMORY_RESERVE_MB:-1024}
    # Routed publicly as harborbox.onvo.ai so onvo-lite, which runs on another
    # host and in another Hetzner project, can reach it. Behind Cloudflare like
    # every other name here, with the host firewall still closed to everything
    # else, and every route requires HARBORBOX_API_KEY.
    #
    # Worth being clear about what this exposes: an authenticated API that
    # creates containers. The sandboxes it creates still have no egress unless
    # the caller asks for it, so widening the API's reach does not widen theirs.
    labels:
      # Routing is a switch, not a constant. A second instance of this stack
      # on the same host must not answer for the live hostname, so the
      # parallel deploy sets this false and is reached by its network alias
      # instead. Traefik ignores a disabled container outright, which also
      # keeps the two from registering the same router names. Flipping this
      # true and stopping the old stack is the whole cutover.
      #
      # Note the router names below cannot be parameterised: Compose
      # substitutes variables in label values, never in label keys.
      traefik.enable: ${HARBORBOX_TRAEFIK_ENABLE:-true}
      # Required, not optional: this container is on three networks and one of
      # them (harborbox-net) is `internal: true`. Without naming the shared
      # network, traefik can resolve the backend to an address with no route
      # and every request hangs until the gateway times out.
      traefik.docker.network: nj9nsajrgcu76alcj6c1sq87
      traefik.http.routers.harborbox-http.entryPoints: http
      traefik.http.routers.harborbox-http.rule: Host(`${HARBORBOX_PUBLIC_HOST:-harborbox.onvo.ai}`)
      traefik.http.routers.harborbox-http.middlewares: redirect-to-https
      traefik.http.routers.harborbox-https.entryPoints: https
      traefik.http.routers.harborbox-https.rule: Host(`${HARBORBOX_PUBLIC_HOST:-harborbox.onvo.ai}`)
      traefik.http.routers.harborbox-https.tls: "true"
      traefik.http.routers.harborbox-https.tls.certresolver: letsencrypt
      traefik.http.routers.harborbox-https.service: harborbox
      traefik.http.services.harborbox.loadbalancer.server.port: "8000"
    volumes:
      # Required: the API creates sandbox containers. This is the one privileged
      # thing Harborbox needs, and the reason it belongs on a host running
      # internal tooling rather than customer-facing apps.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
    restart: unless-stopped
    networks:
      control:
      sandboxes:
      # The Trigger stack's network. `harborbox` is the name task code uses;
      # a parallel deploy takes a different alias so Docker DNS does not
      # round-robin between two stacks.
      trigger:
        aliases:
          - ${HARBORBOX_NETWORK_ALIAS:-harborbox}

volumes:
  harborbox-postgres:

networks:
  control:
  # Declared external because Coolify rewrites managed network definitions and
  # silently dropped this one — the API then created sandboxes against a network
  # that did not exist, and every sandbox went straight to `failed` with nothing
  # in the API log to say why. Created once out of band with:
  #   docker network create --internal harborbox-net
  sandboxes:
    name: ${HARBORBOX_SANDBOX_NETWORK:-harborbox-net}
    external: true
  trigger:
    name: nj9nsajrgcu76alcj6c1sq87
    external: true
