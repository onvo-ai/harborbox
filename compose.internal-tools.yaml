# Harborbox on Onvo's `internal-tools` host, alongside the Trigger.dev stack.
#
# The only consumer is Trigger.dev task code executing widget Python. Those task
# runners are containers on the Trigger stack's own Docker network, so the API
# joins that network as an external and is reachable at `http://harborbox:8000`.
# Nothing is published to the host or to the internet.
#
# Two deliberate differences from compose.yaml:
#
#   1. `HARBORBOX_SANDBOX_EGRESS_NETWORK` is empty, so sandboxes sit only on the
#      `internal: true` network and have no route anywhere. Onvo's worker
#      downloads datasource CSVs and passes them in as files, so widget code
#      never needs to fetch anything. If that ever changes, the sandbox needs
#      egress and this comment is the thing that was wrong.
#
#   2. No published port. compose.yaml binds 127.0.0.1 for local development;
#      here the API must not be reachable from the host at all.
#
# Memory is the binding constraint on this host (~6 GB available), not disk.
# api 768M + postgres 512M + opensandbox 768M + 2 concurrent sandboxes at
# 768M ≈ 3.6 GB, plus 2 warm onvo-pro holding 1.5 GB of reservation.
#
# Since 0.2.0 this runs `opensandbox/server`, as compose.yaml does. That is not
# optional: 0.2.0's template images ship no harborbox agent — no fastapi, no
# uvicorn, `CMD ["tail","-f","/dev/null"]` — because execd runs the code, so
# the old DockerRuntime path has nothing to talk to. The API keeps the docker
# socket anyway, for building derived templates.

name: harborbox

configs:
  # Mirrors compose.yaml's config, with two deliberate differences for this
  # host: no egress section, because sandboxes here must reach nothing, and a
  # narrower port range, since the Trigger stack shares these ephemeral ports.
  opensandbox-config:
    content: |
      [server]
      host = "0.0.0.0"
      port = 8080
      max_sandbox_timeout_seconds = 86400

      [log]
      level = "INFO"

      [runtime]
      type = "docker"
      execd_image = "opensandbox/execd:v1.0.21"

      [store]
      type = "sqlite"
      path = "/var/lib/opensandbox/opensandbox.db"

      [docker]
      network_mode = "bridge"
      host_ip = "host.docker.internal"
      port_range_min = 40000
      port_range_max = 45000
      drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
      no_new_privileges = true
      pids_limit = 4096

      [ingress]
      mode = "direct"

services:
  # One build per static template. 0.2.0 made `template` required on
  # POST /v1/sandboxes and resolves each name to its own image, so the single
  # `harborbox-sandbox-onvo` image this used to build no longer satisfies any
  # request — `image_for_template` would raise for every one of them.
  #
  # All three are tagged, for the same reason the single one was: a second
  # deploy on this host builds the same names, and left at `local` the Coolify
  # build would retag the images the hand-rolled stack launches sandboxes from,
  # changing them without anyone deciding to.
  #
  # Derived templates (POST /v1/templates) are built at runtime by the API from
  # these bases, which is why HARBORBOX_TEMPLATE_IMAGE_PREFIX and
  # HARBORBOX_TEMPLATE_VERSION below must agree with the tags built here.
  #
  # **These three idle forever instead of exiting, and that is the whole point.**
  # They used to be `entrypoint: /bin/true` + `restart: "no"`: build the image,
  # exit 0, done. That lost the images every night. This server has Coolify's
  # *forced* docker cleanup on `0 0 * * *` (`force_docker_cleanup: true`, so the
  # 80% disk threshold never gets a vote), which prunes stopped containers and
  # then runs `docker image prune -af` — delete every image no container refers
  # to. Nothing refers to these: the API launches sandboxes from them at runtime
  # through opensandbox, which is a `docker create` against a name, not a
  # standing reference. So at 00:00 UTC the tags vanished, and the next sandbox
  # create fell through to a registry pull of a locally-built name:
  #
  #   Failed to pull image harborbox-sandbox-onvo-pro:coolify: 404 ...
  #   pull access denied for harborbox-sandbox-onvo-pro, repository does not
  #   exist or may require 'docker login'
  #
  # which Trigger surfaced to the dashboard as "Harborbox sandbox failed to
  # become ready" on every widget. A *running* container is the reference prune
  # honours, so each build target now holds its own image open. `tail -f` and
  # not the image's own CMD: sandbox/Dockerfile starts a Jupyter server, and
  # paying ~150MB three times over to pin three tags would be absurd.
  sandbox-onvo-pro-image:
    image: harborbox-sandbox-onvo-pro:${HARBORBOX_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: sandbox/Dockerfile
      args:
        SANDBOX_REQUIREMENTS: sandbox/requirements-onvo-pro.txt
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    mem_limit: 32m

  sandbox-onvo-lite-image:
    image: harborbox-sandbox-onvo-lite:${HARBORBOX_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: sandbox/Dockerfile
      args:
        SANDBOX_REQUIREMENTS: sandbox/requirements-onvo-lite.txt
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    mem_limit: 32m

  sandbox-relaydeck-image:
    image: harborbox-sandbox-relaydeck:${HARBORBOX_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: sandbox/Dockerfile.relaydeck
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    mem_limit: 32m

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: harborbox
      POSTGRES_USER: harborbox
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_HARBORBOXDB}
    volumes:
      - harborbox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harborbox -d harborbox"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    restart: unless-stopped
    networks:
      - control

  opensandbox:
    image: opensandbox/server:v0.2.2
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_SERVER_API_KEY: ${SERVICE_PASSWORD_64_OPENSANDBOXAPI:?see the API service below - the same key must reach both sides.}
    configs:
      - source: opensandbox-config
        target: /etc/opensandbox/config.toml
    volumes:
      # Same privilege as the API had, for the same reason: something has to
      # create sandbox containers. Under 0.2.0 that is opensandbox, not the API.
      - /var/run/docker.sock:/var/run/docker.sock
      - opensandbox-state:/var/lib/opensandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 512
    restart: unless-stopped
    networks:
      control:
        aliases:
          - opensandbox

  api:
    image: harborbox-api:${HARBORBOX_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      # `service_started`, not `service_completed_successfully`: these three no
      # longer exit (see the note above them), and waiting for a container that
      # idles by design to complete would hang every deploy forever. Compose
      # builds all images before it starts any container, so a started keeper
      # already proves its image was built.
      sandbox-onvo-pro-image:
        condition: service_started
      sandbox-onvo-lite-image:
        condition: service_started
      sandbox-relaydeck-image:
        condition: service_started
      postgres:
        condition: service_healthy
      opensandbox:
        condition: service_healthy
    environment:
      HARBORBOX_API_KEY: ${SERVICE_PASSWORD_64_HARBORBOXAPI:?refusing to start with no API key - every sandbox call would 401. Set it in .env from Infisical Onvo/staging HARBORBOX_API_KEY.}
      HARBORBOX_DATABASE_URL: postgresql+asyncpg://harborbox:${SERVICE_PASSWORD_HARBORBOXDB}@postgres/harborbox
      # The reason 0.2.0's first deploy failed here. Until 0.2.0 the API built
      # `DockerRuntime` directly in its lifespan and never read this setting, so
      # its `opensandbox` default was harmless. 0.2.0 routes through
      # `create_runtime()`, which honours it — and no opensandbox ran on this
      # host, so every create died at DNS with `[Errno -3] Temporary failure in
      # name resolution` before a container existed. Trigger saw "Harborbox
      # sandbox failed to become ready".
      #
      # Set explicitly rather than left to default, because the two halves of
      # this decision live in different files: change it to `docker` and the
      # opensandbox service below becomes dead weight, but the sandbox images
      # also stop working. 0.2.0's template images ship no agent — no fastapi,
      # no uvicorn, `CMD ["tail","-f","/dev/null"]` — because execd runs the
      # code. DockerRuntime polls a harborbox agent on :8080 that those images
      # do not contain, so `docker` needs different images, not just this flag.
      HARBORBOX_RUNTIME_PROVIDER: opensandbox
      HARBORBOX_OPENSANDBOX_DOMAIN: opensandbox:8080
      HARBORBOX_OPENSANDBOX_PROTOCOL: http
      # opensandbox v0.2.2's proxy 500s on execd's streaming /code endpoint
      # ("An internal error occurred in the proxy") while /ping through the same
      # proxy is fine. Python execution therefore goes straight to the execd
      # port opensandbox publishes, which is what extra_hosts below is for.
      HARBORBOX_OPENSANDBOX_USE_SERVER_PROXY: "false"
      HARBORBOX_OPENSANDBOX_API_KEY: ${SERVICE_PASSWORD_64_OPENSANDBOXAPI:?refusing to start with no opensandbox key - the API would fail every sandbox create against the runtime.}
      # Static template images, built above. These three names are what
      # `image_for_template` resolves for onvo-pro/onvo-lite/relaydeck.
      HARBORBOX_ONVO_PRO_IMAGE: harborbox-sandbox-onvo-pro:${HARBORBOX_IMAGE_TAG:-local}
      HARBORBOX_ONVO_LITE_IMAGE: harborbox-sandbox-onvo-lite:${HARBORBOX_IMAGE_TAG:-local}
      HARBORBOX_RELAYDECK_IMAGE: harborbox-sandbox-relaydeck:${HARBORBOX_IMAGE_TAG:-local}
      # Derived templates are named `<base>-<12 hex>` and their image name is a
      # pure function of prefix + version, so these must match the tags built
      # above or a derived template resolves to an image nobody built.
      HARBORBOX_TEMPLATE_IMAGE_PREFIX: harborbox-sandbox
      HARBORBOX_TEMPLATE_VERSION: ${HARBORBOX_IMAGE_TAG:-local}
      HARBORBOX_SANDBOX_NETWORK: ${HARBORBOX_SANDBOX_NETWORK:-harborbox-net}
      # Empty, matching the header: sandboxes sit only on the `internal: true`
      # network and have no route anywhere.
      #
      # This named `harborbox-egress` until 2026-08-05, and that network has
      # never existed on this host — `_connect_egress` does `networks.get(name)`
      # only after a caller opts in, so the first request to ask for egress
      # would have died on a Docker NotFound rather than being cleanly told no.
      # Empty takes the `if not network_name: return` path instead.
      #
      # To actually offer egress here, declare the network below and set this;
      # it is opt-in per sandbox (SandboxCreate.egress, default false), so
      # widget code is unaffected either way.
      HARBORBOX_SANDBOX_EGRESS_NETWORK: ${HARBORBOX_SANDBOX_EGRESS_NETWORK:-}
      HARBORBOX_DEFAULT_SANDBOX_MEMORY_MB: ${HARBORBOX_ONVO_SANDBOX_MEMORY_MB:-768}
      HARBORBOX_DEFAULT_SANDBOX_CPU: ${HARBORBOX_ONVO_SANDBOX_CPU:-1}
      HARBORBOX_MAX_SANDBOX_MEMORY_MB: ${HARBORBOX_MAX_SANDBOX_MEMORY_MB:-2048}
      # Raised from 8 to 10 to hold the old eight execution slots after the warm
      # pool started charging CPU. The host has 8 cores and shares them with the
      # Trigger stack, so this is deliberately an admission ceiling rather than
      # a promise of parallelism — the same over-commit the old pool made
      # implicitly by running four warm sandboxes outside the budget entirely.
      HARBORBOX_MAX_PARALLEL_CPU: ${HARBORBOX_MAX_PARALLEL_CPU:-10}
      HARBORBOX_MAX_CONCURRENT_EXECUTIONS_PER_SANDBOX: ${HARBORBOX_ONVO_CONCURRENCY:-2}
      # Warm pools. HARBORBOX_SANDBOX_POOL_SIZE used to sit here warming 4
      # sandboxes; that pool matched on (memory_mb, cpu, egress) and carried no
      # template, so it could hand an onvo-pro container to a relaydeck caller.
      # 0.2.0 replaced it with per-template pools, which is why they are named
      # individually now. They live in the opensandbox runtime, so they only
      # work at all because the provider above is `opensandbox`.
      #
      # Sized down from the old 4: each pooled onvo-pro holds a 768 MB
      # reservation, so 4 reserved 3 GB of the ~6 GB this host has. Only
      # onvo-pro is used here — Onvo's client sends it for every widget — so the
      # other two warm nothing rather than holding memory for callers that do
      # not exist.
      # One warm onvo-pro. Note the accounting difference from 0.1.0: that pool
      # held a memory reservation but deliberately no CPU budget, while 0.2.0's
      # reserves both (`capacity()` adds warm_pool.cpu to reserved_cpu), so each
      # warm sandbox costs a real admission slot.
      #
      # Sized at one rather than two because two bought nothing: a 43-widget
      # refresh measured 178s per batch at two slots-worth reserved and 190s
      # after freeing them, so admission was not the constraint. **0.2.0 is
      # still ~10x slower than 0.1.0 on this workload** (13-22s per batch
      # before), and the cause is per-sandbox startup, not queueing — an
      # isolated cold create-and-execute is ~6s while executions themselves run
      # in ~200ms. A burst of 43 widgets pays that startup 43 times. Unresolved.
      HARBORBOX_WARM_POOL_ONVO_PRO: ${HARBORBOX_WARM_POOL_ONVO_PRO:-1}
      # Was 0, so every Lite sandbox cold-started — ~6.5s of provisioning on
      # the critical path of a user's first query. One warm slot covers the
      # common case of a single analysis at a time.
      HARBORBOX_WARM_POOL_ONVO_LITE: ${HARBORBOX_WARM_POOL_ONVO_LITE:-1}
      HARBORBOX_WARM_POOL_RELAYDECK: ${HARBORBOX_WARM_POOL_RELAYDECK:-0}
      #
      # Per-template sizing, pinned to what this host was already running.
      # 0.2.0 takes resources from the resolved template, not from
      # HARBORBOX_DEFAULT_SANDBOX_*, and onvo-pro's built-in default is
      # 1024 MB / 2.0 CPU. Left alone that silently halves concurrency here:
      # MAX_PARALLEL_CPU is 10, so 2.0 CPU per sandbox halves how many fit.
      # Onvo's widget code has run in 768 MB / 1 CPU all along.
      HARBORBOX_ONVO_PRO_TEMPLATE_MEMORY_MB: ${HARBORBOX_ONVO_SANDBOX_MEMORY_MB:-768}
      HARBORBOX_ONVO_PRO_TEMPLATE_CPU: ${HARBORBOX_ONVO_SANDBOX_CPU:-1}
      #
      # onvo-lite was never pinned, so it inherited the old 2.0 CPU default
      # while onvo-pro was pinned to 1.0 right above — the two Onvo sandboxes
      # were sized differently for no reason anyone had decided. Measured on a
      # real datasource analysis, DuckDB profiling took ~2.5s at 1.0 CPU and the
      # run was dominated by the model, not compute. At 2.0 the host fits two
      # concurrent Lite analyses; at 1.0 it fits four.
      HARBORBOX_ONVO_LITE_TEMPLATE_MEMORY_MB: ${HARBORBOX_ONVO_LITE_SANDBOX_MEMORY_MB:-1024}
      HARBORBOX_ONVO_LITE_TEMPLATE_CPU: ${HARBORBOX_ONVO_LITE_SANDBOX_CPU:-1}
      HARBORBOX_DEFAULT_IDLE_TIMEOUT_SECONDS: ${HARBORBOX_ONVO_IDLE_TIMEOUT_SECONDS:-180}
      # Leave headroom for the Trigger stack, which shares this host.
      HARBORBOX_HOST_MEMORY_RESERVE_PERCENT: ${HARBORBOX_HOST_MEMORY_RESERVE_PERCENT:-25}
      HARBORBOX_PLATFORM_MEMORY_RESERVE_MB: ${HARBORBOX_PLATFORM_MEMORY_RESERVE_MB:-1024}
    extra_hosts:
      # Reaching the published execd port needs the host gateway; see
      # HARBORBOX_OPENSANDBOX_USE_SERVER_PROXY above.
      - "host.docker.internal:host-gateway"
    volumes:
      # Still required, though no longer for running sandboxes — opensandbox
      # does that now. The API builds derived template images (POST
      # /v1/templates) with docker directly, so it keeps the socket. This is
      # the privileged thing Harborbox needs, and the reason it belongs on a
      # host running internal tooling rather than customer-facing apps.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
    restart: unless-stopped
    labels:
      # Publishes exactly one path — GET /health — at harborbox.onvo.ai, so
      # Uptime Kuma can probe it from another host. Everything else stays
      # unroutable from the internet: the rule uses `Path`, which is an exact
      # match, not `PathPrefix`. Do not relax it to PathPrefix(`/`) — this API
      # holds the docker socket, and /v1/sandboxes would then be one guessed
      # HARBORBOX_API_KEY away from arbitrary code execution on this host.
      #
      # Router names are explicit and unique (`harborbox-health`) because
      # Coolify generates its own `http-0-<uuid>` / `https-0-<uuid>` routers
      # and will clobber same-named ones on redeploy.
      #
      # traefik.docker.network is required: this container sits on four
      # networks and Traefik picks one arbitrarily without it. It must name the
      # network coolify-proxy actually shares with the API.
      - traefik.enable=true
      - traefik.docker.network=u95r9dynmb7i2kn945n61qiq
      - traefik.http.routers.harborbox-health.rule=Host(`harborbox.onvo.ai`) && Path(`/health`)
      - traefik.http.routers.harborbox-health.entryPoints=https
      - traefik.http.routers.harborbox-health.tls=true
      - traefik.http.routers.harborbox-health.tls.certresolver=letsencrypt
      - traefik.http.routers.harborbox-health.service=harborbox-health
      - traefik.http.services.harborbox-health.loadbalancer.server.port=8000
      #
      # A second router publishes the API itself — /v1 only — for Onvo Lite,
      # which runs on onvo-production (188.245.108.57) and so cannot use the
      # internal http://harborbox:8000 the way Trigger can from this host.
      #
      # Read the warning above before touching this. The docker socket makes an
      # open /v1 an arbitrary-code-execution surface, so the route is NOT open:
      #
      #  1. It hangs off harborbox-api.onvo.ai, which is DNS-only in Cloudflare
      #     (grey cloud), NOT proxied. That is load-bearing: harborbox.onvo.ai
      #     IS proxied, and behind Cloudflare every request reaches Traefik
      #     wearing a Cloudflare source address, which would make the allowlist
      #     below match everyone or no one.
      #  2. `ipAllowList` restricts it to the two hosts that run Lite. The API
      #     key stops being the only thing between the internet and the docker
      #     socket; an attacker now needs the key *and* one of these hosts.
      #  3. PathPrefix(`/v1`), so /openapi.json and /docs stay unroutable.
      #
      # Adding a Lite host means adding its egress IP here. If Lite is ever
      # co-located with Harborbox, delete this router rather than leaving a
      # public route nothing needs.
      - traefik.http.routers.harborbox-api.rule=Host(`harborbox-api.onvo.ai`) && PathPrefix(`/v1`)
      - traefik.http.routers.harborbox-api.entryPoints=https
      - traefik.http.routers.harborbox-api.tls=true
      - traefik.http.routers.harborbox-api.tls.certresolver=letsencrypt
      - traefik.http.routers.harborbox-api.service=harborbox-api
      - traefik.http.routers.harborbox-api.middlewares=harborbox-api-allowlist
      - traefik.http.services.harborbox-api.loadbalancer.server.port=8000
      # onvo-production (Lite prod) and staging-server (Lite staging).
      - traefik.http.middlewares.harborbox-api-allowlist.ipAllowList.sourceRange=188.245.108.57/32,116.203.66.157/32
    networks:
      # Each entry carries an alias deliberately. Coolify's compose rewriter
      # drops service network entries whose value is null, which silently left
      # the API on neither the control nor the sandbox network — it came up
      # healthy and could not reach a single sandbox it created. An alias is
      # the smallest thing that makes the entry survive the rewrite.
      control:
        aliases:
          - harborbox-control
      sandboxes:
        aliases:
          - harborbox-sandboxes
      # The Trigger stack's network. `harborbox` is the name task code uses;
      # a parallel deploy takes a different alias so Docker DNS does not
      # round-robin between two stacks.
      trigger:
        aliases:
          - ${HARBORBOX_NETWORK_ALIAS:-harborbox}

volumes:
  harborbox-postgres:
  opensandbox-state:

networks:
  control:
  # Declared external because Coolify rewrites managed network definitions and
  # silently dropped this one — the API then created sandboxes against a network
  # that did not exist, and every sandbox went straight to `failed` with nothing
  # in the API log to say why. Created once out of band with:
  #   docker network create --internal harborbox-net
  sandboxes:
    name: ${HARBORBOX_SANDBOX_NETWORK:-harborbox-net}
    external: true
  trigger:
    name: nj9nsajrgcu76alcj6c1sq87
    external: true
