[project]
name = "harborbox"
version = "0.2.0"
description = "Durable admission and orchestration for OpenSandbox runtimes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "asyncpg>=0.30.0",
  "cryptography>=45.0.0",
  "docker>=7.1.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "opensandbox>=0.1.15,<0.2.0",
  "opensandbox-code-interpreter>=0.1.2,<0.2.0",
  "pydantic-settings>=2.10.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harborbox", "src/harborbox_sdk"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
  "ASYNC240", # The sandbox agent intentionally performs tiny local filesystem calls.
  "B008",     # FastAPI's Depends/Query call defaults are framework conventions.
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["harborbox", "harborbox_sdk"]

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true
