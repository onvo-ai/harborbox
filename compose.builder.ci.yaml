# CI-only override for compose.builder.yaml, layered after compose.builder.local.yaml.
# Do not use this file for a deploy.
#
# The Coolify CI runners run Docker inside a Sysbox sidecar, and rootless
# BuildKit does not run there. It starts its own user namespace, and Sysbox
# only handles /proc mounts for processes in the sidecar's own namespace, so
# every build step failed on its /proc mount ("operation not permitted", and
# "invalid argument" with --oci-worker-no-process-sandbox). The rootless
# image's sub-ID range (100000+) and its /dev/fuse device do not exist in the
# sidecar either.
#
# So CI runs rootful BuildKit, privileged, the way Docker itself runs inside
# the sidecar. "Privileged" here means inside the sidecar's user namespace, not
# root on build-server. It keeps compose.builder.yaml's config, certificates,
# network and state volume, so the API drives it exactly as it drives the
# deployed builder. What CI no longer covers is the rootless hardening itself;
# that stays verified on the deploy, per docs/arbitrary-dockerfile-templates.md
# section 10.
services:
  builder:
    image: moby/buildkit:latest
    privileged: true
    devices: !reset []
    command:
      - --config=/home/user/.config/buildkit/buildkitd.toml
      - --root=/home/user/.local/share/buildkit
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "unix:///run/user/1000/buildkit/buildkitd.sock", "debug", "workers"]
